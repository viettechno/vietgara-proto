syntax = "proto3";

package vietgara.identity.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "vietgara/identity/v1/user.proto";

option go_package = "github.com/viettechno/vietgara-proto/apis-go/vietgara/identity/v1;identityv1";

// AuthService handles sign-up, sign-in, sessions, e-mail verification and
// password reset (FRD 3.1). Google sign-in uses the OAuth redirect routes
// GET /api/v1/auth/google/login and /callback, which are plain HTTP handlers.
service AuthService {
  // Registers a user as an owner with e-mail and password (FR-IAM-01). The
  // user starts unverified and a verification OTP is e-mailed.
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/register"
      body: "*"
      response_body: "session"
    };
  }

  // Signs in with e-mail and password (FR-IAM-02).
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
      response_body: "session"
    };
  }

  // Signs in with a Google ID token obtained natively by a mobile app
  // (FR-IAM-01, FR-CAPP-01). The token's signature, issuer, audience (one
  // of the configured mobile client IDs) and verified e-mail are checked;
  // the user is found by its Google subject or e-mail, or created --
  // the same rules as the web's Google redirect sign-in.
  rpc SignInWithGoogleIdToken(SignInWithGoogleIdTokenRequest) returns (SignInWithGoogleIdTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/google/id-token"
      body: "*"
      response_body: "session"
    };
  }

  // Completes a sign-in that answered mfa_required (FR-IAM-09): exchanges the
  // challenge token and a TOTP code or an unused recovery code for the
  // session. Five wrong codes lock the challenge for 15 minutes.
  rpc VerifyMfaChallenge(VerifyMfaChallengeRequest) returns (VerifyMfaChallengeResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/mfa/challenge"
      body: "*"
      response_body: "session"
    };
  }

  // Exchanges a refresh token for a new session; the old token is revoked
  // (rotation).
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
      response_body: "session"
    };
  }

  // Revokes a refresh token.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
  }

  // E-mails a new 6-digit verification OTP, valid for 2 minutes, to the
  // signed-in user.
  rpc SendEmailVerificationOtp(SendEmailVerificationOtpRequest) returns (SendEmailVerificationOtpResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/email-verification/otp"
      body: "*"
      response_body: "challenge"
    };
  }

  // Confirms the signed-in user's e-mail with the OTP and returns a
  // session whose token is marked verified.
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/email-verification"
      body: "*"
      response_body: "session"
    };
  }

  // FR-IAM-06 (Release 10.3), web consoles: the console opens the Google popup
  // (GET /api/v1/auth/google/login?link=1); its callback verifies the Google
  // account and posts a single-use proof (5 minutes) to the console window
  // that opened it, restricted to the console's origin. This call links that
  // Google account to the signed-in user, who confirms with the password. The
  // proof reaches only the page that opened the popup, so a page of another
  // origin cannot make a user link their Google account to someone else.
  // Errors as LinkGoogle, and LINK_PROOF_INVALID.
  rpc CompleteGoogleLink(CompleteGoogleLinkRequest) returns (CompleteGoogleLinkResponse) {
    option (google.api.http) = {
      post: "/api/v1/me/google-link:complete"
      body: "*"
      response_body: "user"
    };
  }

  // FR-IAM-06 (Release 10.3), mobile apps: links the Google account of a
  // Google ID token (obtained natively, verified like SignInWithGoogleIdToken)
  // to the signed-in user, who confirms with the password. Linking the account
  // that is already linked changes nothing. Errors: PASSWORD_INCORRECT (403),
  // NO_PASSWORD (412), GOOGLE_ALREADY_LINKED and GOOGLE_LINK_EXISTS (409),
  // GOOGLE_TOKEN_INVALID (401) and GOOGLE_NOT_CONFIGURED.
  rpc LinkGoogle(LinkGoogleRequest) returns (LinkGoogleResponse) {
    option (google.api.http) = {
      post: "/api/v1/me/google-link"
      body: "*"
      response_body: "user"
    };
  }

  // FR-IAM-06 (Release 10.3): removes the linked Google account, after the
  // password. The last way to sign in is never removed (NO_PASSWORD), and a
  // user with no Google account answers GOOGLE_NOT_LINKED (412). Every other
  // session of the user is revoked, and the call answers a new one.
  rpc UnlinkGoogle(UnlinkGoogleRequest) returns (UnlinkGoogleResponse) {
    option (google.api.http) = {
      post: "/api/v1/me/google-link:unlink"
      body: "*"
      response_body: "session"
    };
  }

  // Starts a password reset (FR-IAM-04): e-mails an OTP valid for 2
  // minutes. Always succeeds so user existence is not revealed.
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/password-reset/otp"
      body: "*"
      response_body: "challenge"
    };
  }

  // Checks the password-reset OTP and returns a short-lived reset token.
  rpc VerifyPasswordResetOtp(VerifyPasswordResetOtpRequest) returns (VerifyPasswordResetOtpResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/password-reset/otp/verification"
      body: "*"
    };
  }

  // Sets a new password with the reset token and revokes every session.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/password-reset"
      body: "*"
    };
  }
}

// Session is what every successful sign-in returns. When the user has MFA
// enabled and signs in with e-mail and password, the sign-in answers with
// mfa_required = true and a challenge_token instead of tokens (access_token
// and refresh_token are empty); the client then calls VerifyMfaChallenge.
// Google sign-in never asks for the second factor.
message Session {
  string access_token = 1;
  string refresh_token = 2;
  // Always "Bearer".
  string token_type = 3;
  // Access token lifetime in seconds.
  int64 expires_in = 4;
  User user = 5;
  // True when the sign-in is not complete: ask for the second factor.
  bool mfa_required = 6;
  // Single-use token for VerifyMfaChallenge; valid for 5 minutes.
  string challenge_token = 7;
  google.protobuf.Timestamp challenge_expires_at = 8;
}

// OtpChallenge tells the client how long the e-mailed OTP is valid.
message OtpChallenge {
  google.protobuf.Timestamp expires_at = 1;
  // A new OTP cannot be requested before this time.
  google.protobuf.Timestamp resend_available_at = 2;
}

message RegisterRequest {
  string email = 1 [(google.api.field_behavior) = REQUIRED];
  // At least 8 characters.
  string password = 2 [(google.api.field_behavior) = REQUIRED];
  string full_name = 3 [(google.api.field_behavior) = REQUIRED];
  optional string phone = 4;
  // Defaults to Vietnamese.
  Locale locale = 5;
}

message RegisterResponse {
  Session session = 1;
}

message LoginRequest {
  string email = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [(google.api.field_behavior) = REQUIRED];
}

message LoginResponse {
  Session session = 1;
}

message CompleteGoogleLinkRequest {
  // The proof the Google popup posted to the console.
  string link_proof = 1 [(google.api.field_behavior) = REQUIRED];
  // The signed-in user's current password.
  string password = 2 [(google.api.field_behavior) = REQUIRED];
}

message CompleteGoogleLinkResponse {
  User user = 1;
}

message LinkGoogleRequest {
  // The ID token (a JWT) returned by Google Sign-In on the device.
  string id_token = 1 [(google.api.field_behavior) = REQUIRED];
  // The signed-in user's current password.
  string password = 2 [(google.api.field_behavior) = REQUIRED];
}

message LinkGoogleResponse {
  User user = 1;
}

message UnlinkGoogleRequest {
  // The signed-in user's current password.
  string password = 1 [(google.api.field_behavior) = REQUIRED];
}

message UnlinkGoogleResponse {
  // A new session: every other one of the user was revoked.
  Session session = 1;
}

message SignInWithGoogleIdTokenRequest {
  // The ID token (a JWT) returned by Google Sign-In on the device.
  string id_token = 1 [(google.api.field_behavior) = REQUIRED];
  // The UI language of a newly created user; defaults to Vietnamese.
  Locale locale = 2;
}

message SignInWithGoogleIdTokenResponse {
  Session session = 1;
}

message VerifyMfaChallengeRequest {
  string challenge_token = 1 [(google.api.field_behavior) = REQUIRED];
  // A 6-digit TOTP code, or a recovery code (which works once).
  string code = 2 [(google.api.field_behavior) = REQUIRED];
}

message VerifyMfaChallengeResponse {
  Session session = 1;
}

message RefreshTokenRequest {
  string refresh_token = 1 [(google.api.field_behavior) = REQUIRED];
}

message RefreshTokenResponse {
  Session session = 1;
}

message LogoutRequest {
  string refresh_token = 1 [(google.api.field_behavior) = REQUIRED];
}

message LogoutResponse {}

message SendEmailVerificationOtpRequest {}

message SendEmailVerificationOtpResponse {
  OtpChallenge challenge = 1;
}

message VerifyEmailRequest {
  string otp_code = 1 [(google.api.field_behavior) = REQUIRED];
  // The refresh token of the current session; it is rotated so the new
  // session carries the verified claim.
  string refresh_token = 2 [(google.api.field_behavior) = REQUIRED];
}

message VerifyEmailResponse {
  Session session = 1;
}

message RequestPasswordResetRequest {
  string email = 1 [(google.api.field_behavior) = REQUIRED];
}

message RequestPasswordResetResponse {
  OtpChallenge challenge = 1;
}

message VerifyPasswordResetOtpRequest {
  string email = 1 [(google.api.field_behavior) = REQUIRED];
  string otp_code = 2 [(google.api.field_behavior) = REQUIRED];
}

message VerifyPasswordResetOtpResponse {
  // Single-use token for ResetPassword.
  string reset_token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ResetPasswordRequest {
  string reset_token = 1 [(google.api.field_behavior) = REQUIRED];
  // At least 8 characters.
  string new_password = 2 [(google.api.field_behavior) = REQUIRED];
}

message ResetPasswordResponse {}
