syntax = "proto3";

package vietgara.customer.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "vietgara/common/v1/pagination.proto";

option go_package = "github.com/viettechno/vietgara-proto/apis-go/vietgara/customer/v1;customerv1";

// Vehicle belongs to one customer of the garage (FR-CUS-02).
message Vehicle {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string garage_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string customer_id = 3 [(google.api.field_behavior) = REQUIRED];
  string customer_name = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Unique per garage (ignoring punctuation and case).
  string license_plate = 5 [(google.api.field_behavior) = REQUIRED];
  optional string make = 6;
  optional string model = 7;
  optional int32 year = 8;
  optional string vin = 9;
  optional string engine_number = 10;
  google.protobuf.Timestamp created_at = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message CreateVehicleRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  Vehicle vehicle = 2 [(google.api.field_behavior) = REQUIRED];
}

message CreateVehicleResponse {
  Vehicle vehicle = 1;
}

message GetVehicleRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string vehicle_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message GetVehicleResponse {
  Vehicle vehicle = 1;
}

message UpdateVehicleRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string vehicle_id = 2 [(google.api.field_behavior) = REQUIRED];
  // customer_id may move the vehicle to another customer of the garage.
  Vehicle vehicle = 3 [(google.api.field_behavior) = REQUIRED];
  // Filled from the JSON body keys when omitted.
  google.protobuf.FieldMask update_mask = 4;
}

message UpdateVehicleResponse {
  Vehicle vehicle = 1;
}

message ListVehiclesRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Only this customer's vehicles.
  string customer_id = 2;
  // Matches license plate, make or model.
  string query = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListVehiclesResponse {
  repeated Vehicle data = 1;
  vietgara.common.v1.Pagination pagination = 2;
}

message DeleteVehicleRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string vehicle_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeleteVehicleResponse {}

// VehicleService manages vehicles (FRD 3.4). Filter by customer with
// ?customerId=. Reads need PERMISSION_CUSTOMER_READ, changes
// PERMISSION_CUSTOMER_WRITE.
service VehicleService {
  rpc ListVehicles(ListVehiclesRequest) returns (ListVehiclesResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/vehicles"};
  }

  rpc CreateVehicle(CreateVehicleRequest) returns (CreateVehicleResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/vehicles"
      body: "vehicle"
      response_body: "vehicle"
    };
  }

  rpc GetVehicle(GetVehicleRequest) returns (GetVehicleResponse) {
    option (google.api.http) = {
      get: "/api/v1/garages/{garage_id}/vehicles/{vehicle_id}"
      response_body: "vehicle"
    };
  }

  rpc UpdateVehicle(UpdateVehicleRequest) returns (UpdateVehicleResponse) {
    option (google.api.http) = {
      patch: "/api/v1/garages/{garage_id}/vehicles/{vehicle_id}"
      body: "vehicle"
      response_body: "vehicle"
    };
  }

  rpc DeleteVehicle(DeleteVehicleRequest) returns (DeleteVehicleResponse) {
    option (google.api.http) = {delete: "/api/v1/garages/{garage_id}/vehicles/{vehicle_id}"};
  }
}
