  string quote_id = 2 [(google.api.field_behavior) = REQUIRED];
  // K80 or K57: the roll of the printer the client sends to.
  PaperSize paper_size = 3 [(google.api.field_behavior) = REQUIRED];
}

message PrintPaymentVoucherEscPosRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string settlement_id = 2 [(google.api.field_behavior) = REQUIRED];
  string payment_id = 3 [(google.api.field_behavior) = REQUIRED];
  // K80 or K57: the roll of the printer the client sends to.
  PaperSize paper_size = 4 [(google.api.field_behavior) = REQUIRED];
}

// PartLabelCopies is how many labels of one part, in one unit, to print.
message PartLabelCopies {
  string part_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 1 to 100.
  int32 copies = 2 [(google.api.field_behavior) = REQUIRED];
  // A packaging unit of the part (a case): the label carries that unit's
  // first barcode (in the order of Part.barcodes) and its name, so a scan
  // counts a case. Unset, empty or the part's base unit is the base unit,
  // whose label carries its first barcode, or the SKU when it has none. A
  // unit that is not the part's, or that has no barcode, is refused
  // (INVALID_ARGUMENT): the base unit's code on a case would count one.
  optional string unit_id = 3;
}

message PrintPartLabelsRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // LABEL_50X30, the only label size of Release 13.0.
  PaperSize paper_size = 2 [(google.api.field_behavior) = REQUIRED];
  // 1 to 50 entries, each part and unit at most once (the base unit named
  // or not), at most 300 labels in all. A client printing the labels of a
  // goods receipt fills them from its lines.
  repeated PartLabelCopies parts = 3 [(google.api.field_behavior) = REQUIRED];
}

// DocumentService renders PDFs and Excel reports on request (FRD 3.13).
// Every document is generated fresh from the owning module's own data, read
// through a narrow interface the same way every other cross-module read
// works (HLD Section 2: a module never queries another module's tables
// directly), with a built-in template per document type, paper size and
// version (Release 10.0; a garage designing its own templates is FR-DOC-03,
// Phase 13). Each RPC needs the same
// permission as the data it renders (quote.read, billing.read,
// inventory.read), not a permission of its own.
service DocumentService {
  // FR-DOC-01: the quote as a PDF, using the garage's standard layout.
  rpc ExportQuotePdf(ExportQuotePdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/quotes/{quote_id}/pdf"};
  }

  // FR-DOC-01: the repair order as a PDF, using the garage's standard
  // layout.
  rpc ExportRepairOrderPdf(ExportRepairOrderPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/repair-orders/{repair_order_id}/pdf"};
  }

  // FR-DOC-01: the settlement as a receipt PDF.
  rpc ExportSettlementReceiptPdf(ExportSettlementReceiptPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/settlements/{settlement_id}/receipt-pdf"};
  }

  // FR-BIL-05: one payment voucher (phiếu thu) as a PDF in the 01-TT
  // layout: the garage's legal header, amount in figures and words, and
  // signature blocks.
  rpc ExportPaymentVoucherPdf(ExportPaymentVoucherPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/settlements/{settlement_id}/payments/{payment_id}/voucher-pdf"};
  }

  // FR-DOC-02: the stock in/out/on-hand movement report (FR-INV-05) as an
  // Excel workbook; same filter as the JSON report
  // (InventoryService.ListStockTransactions).
  rpc ExportStockMovementsExcel(ExportStockMovementsExcelRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/reports/stock-movements/excel"};
  }

  // FR-DOC-02 (Release 6.0): the revenue-by-period report
  // (ReportingService.GetRevenueReport) as an Excel workbook.
  rpc ExportRevenueExcel(ExportRevenueExcelRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/reports/revenue/excel"};
  }

  // FR-INV-06 (Release 7.0): a goods receipt document as a PDF.
  rpc ExportGoodsReceiptPdf(ExportGoodsReceiptPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/goods-receipts/{goods_receipt_id}/pdf"};
  }

  // FR-INV-20 (Release 7.0): the repair order's stock issue document
  // (phiếu xuất kho) as a PDF.
  rpc ExportStockIssuePdf(ExportStockIssuePdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/repair-orders/{repair_order_id}/stock-issue/pdf"};
  }

  // FR-INV-12 (Release 7.1): a stock count as an Excel workbook for review
  // (counted against system quantity per line, with the value of the
  // difference when the caller has inventory.cost.read).
  rpc ExportStockCountExcel(ExportStockCountExcelRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/stock-counts/{stock_count_id}/excel"};
  }

  // FR-INV-19 (Release 7.0): the purchases-by-supplier report
  // (InventoryService.GetPurchasesReport) as an Excel workbook. Needs
  // inventory.cost.read.
  rpc ExportPurchasesExcel(ExportPurchasesExcelRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/reports/purchases/excel"};
  }

  // FR-INV-07 (Release 7.0): the stock valuation report
  // (InventoryService.GetStockValuationReport) as an Excel workbook. Needs
  // inventory.cost.read.
  rpc ExportStockValuationExcel(ExportStockValuationExcelRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/reports/stock-valuation/excel"};
  }

  // FR-DOC-04, FR-DOC-05 (Release 10.0): the garage's print choice for each
  // document type, defaults filled in. Needs membership of the garage.
  rpc GetPrintSettings(GetPrintSettingsRequest) returns (GetPrintSettingsResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/print-settings"};
  }

  // FR-DOC-04 (Release 10.0): replaces the paper size and the copy mark of
  // one document type; an omitted copy_mark means false, and the type is the
  // one in the path. An unspecified document type, PART_LABEL, an
  // unspecified paper size, a roll or a label, and a size the type has no
  // template for are refused (INVALID_ARGUMENT).
  rpc UpdatePrintSetting(UpdatePrintSettingRequest) returns (PrintSetting) {
    option (google.api.http) = {
      put: "/api/v1/garages/{garage_id}/print-settings/{document_type}"
      body: "*"
    };
  }

  // FR-DOC-05 (Release 10.0): the Print* RPCs render like the matching
  // Export*Pdf RPC (the request's paper_size, the page size of the client's
  // printer, else the garage's print setting; the template version of
  // the document's first print on that paper size, the newest version for a
  // size it was never printed on), add the copy mark of a
  // reprint (after a print on any paper) when the garage turned it on, and
  // write the print log. Each needs the permission of the
  // data it renders.
  rpc PrintQuotePdf(PrintQuotePdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/quotes/{quote_id}/pdf:print"
      body: "*"
    };
  }

  rpc PrintRepairOrderPdf(PrintRepairOrderPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/repair-orders/{repair_order_id}/pdf:print"
      body: "*"
    };
  }

  rpc PrintSettlementReceiptPdf(PrintSettlementReceiptPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/settlements/{settlement_id}/receipt-pdf:print"
      body: "*"
    };
  }

  rpc PrintPaymentVoucherPdf(PrintPaymentVoucherPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/settlements/{settlement_id}/payments/{payment_id}/voucher-pdf:print"
      body: "*"
    };
  }

  rpc PrintGoodsReceiptPdf(PrintGoodsReceiptPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/goods-receipts/{goods_receipt_id}/pdf:print"
      body: "*"
    };
  }

  rpc PrintStockIssuePdf(PrintStockIssuePdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/repair-orders/{repair_order_id}/stock-issue/pdf:print"
      body: "*"
    };
  }

  // FR-BIL-07 (Release 11.0): a payment-out voucher (phiếu chi) as a PDF.
  rpc ExportPaymentOutVoucherPdf(ExportPaymentOutVoucherPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/payment-out-vouchers/{voucher_id}/pdf"};
  }

  rpc PrintPaymentOutVoucherPdf(PrintPaymentOutVoucherPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/payment-out-vouchers/{voucher_id}/pdf:print"
      body: "*"
    };
  }

  // FR-INV-16 (Release 11.0): a purchase order as a PDF.
  rpc ExportPurchaseOrderPdf(ExportPurchaseOrderPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/purchase-orders/{purchase_order_id}/pdf"};
  }

  rpc PrintPurchaseOrderPdf(PrintPurchaseOrderPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/purchase-orders/{purchase_order_id}/pdf:print"
      body: "*"
    };
  }

  // FR-DOC-02 (Release 11.0): the receivables list
  // (ReceivableService.ListReceivables) as an Excel workbook.
  rpc ExportReceivablesExcel(ExportReceivablesExcelRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/reports/receivables/excel"};
  }

  // FR-REC-04 (Release 11.0): the reconciliation of a period
  // (ReceivableService.GetReconciliationReport) as an Excel workbook.
  rpc ExportReceivableReconciliationExcel(ExportReceivableReconciliationExcelRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/reports/receivable-reconciliation/excel"};
  }

  // FR-INV-17 (Release 11.0): the supplier payables as an Excel workbook.
  rpc ExportSupplierPayablesExcel(ExportSupplierPayablesExcelRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/reports/supplier-payables/excel"};
  }

  // FR-DOC-07 (Release 13.0): the garage's network printers, by name. Needs
  // membership of the garage.
  rpc ListPrinters(ListPrintersRequest) returns (ListPrintersResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/printers"};
  }

  // FR-DOC-07: saves a printer. Needs the permission that edits the garage
  // profile. An invalid field, a duplicate name, a document type the
  // printer cannot take, and a 21st printer are refused (INVALID_ARGUMENT).
  rpc CreatePrinter(CreatePrinterRequest) returns (Printer) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/printers"
      body: "printer"
    };
  }

  // FR-DOC-07: replaces a printer, with the rules of CreatePrinter.
  rpc UpdatePrinter(UpdatePrinterRequest) returns (Printer) {
    option (google.api.http) = {
      put: "/api/v1/garages/{garage_id}/printers/{printer_id}"
      body: "printer"
    };
  }

  // FR-DOC-07: removes a printer.
  rpc DeletePrinter(DeletePrinterRequest) returns (DeletePrinterResponse) {
    option (google.api.http) = {delete: "/api/v1/garages/{garage_id}/printers/{printer_id}"};
  }

  // FR-DOC-07: a test page for the printer, in its language: ESC/POS on its
  // roll or label for a raw printer, a PDF on its page size (A4 when it has
  // none) for an IPP printer. The client
  // sends it to the printer from the device it tests. Needs membership of
  // the garage; nothing is logged.
  rpc PrintPrinterTestPage(PrintPrinterTestPageRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {post: "/api/v1/garages/{garage_id}/printers/{printer_id}/test-page:print"};
  }

  // FR-DOC-06 (Release 13.0): the quote on a K80 or K57 roll, as ESC/POS
  // (application/octet-stream) for the client to send to a raw printer.
  // Same rules as PrintQuotePdf with the roll as the paper size: the
  // template version is the one of the document's first print on that roll
  // (a version is pinned per paper size), the copy mark goes on a reprint
  // after a print on any paper when the copy_mark of the document type's
  // PrintSetting is on, and the print is logged. A page size or a
  // label is refused (INVALID_ARGUMENT). Needs quote.read.
  rpc PrintQuoteEscPos(PrintQuoteEscPosRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/quotes/{quote_id}/escpos:print"
      body: "*"
    };
  }

  // FR-DOC-06: the payment voucher on a K80 or K57 roll, as ESC/POS, with
  // the rules of PrintQuoteEscPos (version per roll, copy mark, print log).
  // Needs billing.read.
  rpc PrintPaymentVoucherEscPos(PrintPaymentVoucherEscPosRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/settlements/{settlement_id}/payments/{payment_id}/voucher-escpos:print"
      body: "*"
    };
  }

  // FR-INV-13 (Release 13.0): barcode labels of parts (name, SKU and a Code
  // 128 barcode of the base unit's first barcode, or of the SKU when it has
  // none; a code that is not ASCII or too long for a readable barcode on the
  // label is refused, INVALID_ARGUMENT)
  // as ESC/POS for a raw label printer. Needs the permission that reads
  // parts; nothing is logged. Another paper, copies outside 1 to 100, a part
  // listed twice, more than 50 parts or 300 labels are refused
  // (INVALID_ARGUMENT); a part the garage does not have is NOT_FOUND.
  rpc PrintPartLabels(PrintPartLabelsRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/part-labels:print"
      body: "*"
    };
  }
}
