syntax = "proto3";

package vietgara.document.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/httpbody.proto";
import "vietgara/reporting/v1/reporting.proto";

option go_package = "github.com/viettechno/vietgara-proto/apis-go/vietgara/document/v1;documentv1";

message ExportQuotePdfRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string quote_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message ExportRepairOrderPdfRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string repair_order_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message ExportSettlementReceiptPdfRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string settlement_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message ExportPaymentVoucherPdfRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string settlement_id = 2 [(google.api.field_behavior) = REQUIRED];
  string payment_id = 3 [(google.api.field_behavior) = REQUIRED];
}

message ExportStockMovementsExcelRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Same optional filter as InventoryService.ListStockTransactions.
  string part_id = 2;
}

message ExportRevenueExcelRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  vietgara.reporting.v1.RevenuePeriod period = 2 [(google.api.field_behavior) = REQUIRED];
  // Inclusive, "YYYY-MM-DD" in the garage's timezone.
  string from = 3 [(google.api.field_behavior) = REQUIRED];
  // Exclusive, "YYYY-MM-DD".
  string to = 4 [(google.api.field_behavior) = REQUIRED];
}

message ExportGoodsReceiptPdfRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string goods_receipt_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message ExportStockIssuePdfRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string repair_order_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message ExportStockCountExcelRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string stock_count_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message ExportPurchasesExcelRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Same optional filters as InventoryService.GetPurchasesReport.
  string supplier_id = 2;
  // Inclusive, "YYYY-MM-DD" in the garage's timezone.
  string from = 3;
  // Exclusive, "YYYY-MM-DD".
  string to = 4;
}

message ExportStockValuationExcelRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // The date to value at, "YYYY-MM-DD"; empty means today.
  string at = 2;
}

// DocumentType is a document a garage can print (FR-DOC-04).
enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;
  DOCUMENT_TYPE_QUOTE = 1;
  DOCUMENT_TYPE_REPAIR_ORDER = 2;
  DOCUMENT_TYPE_SETTLEMENT = 3;
  DOCUMENT_TYPE_PAYMENT_VOUCHER = 4;
  DOCUMENT_TYPE_GOODS_RECEIPT = 5;
  DOCUMENT_TYPE_STOCK_ISSUE = 6;
}

// PaperSize is the paper a document prints on: A4 (210 x 297 mm) or A5
// (148 x 210 mm).
enum PaperSize {
  PAPER_SIZE_UNSPECIFIED = 0;
  PAPER_SIZE_A4 = 1;
  PAPER_SIZE_A5 = 2;
}

// PrintSetting is a garage's printing choice for one document type
// (FR-DOC-04). A garage that never changed it prints on A4 without the
// copy mark.
message PrintSetting {
  DocumentType document_type = 1;
  PaperSize paper_size = 2;
  // Whether a reprint carries a "copy" mark.
  bool copy_mark = 3;
  // The sizes the document type has a template for.
  repeated PaperSize available_paper_sizes = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetPrintSettingsRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetPrintSettingsResponse {
  // One entry for each document type, defaults filled in.
  repeated PrintSetting settings = 1;
}

message UpdatePrintSettingRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  DocumentType document_type = 2 [(google.api.field_behavior) = REQUIRED];
  PaperSize paper_size = 3 [(google.api.field_behavior) = REQUIRED];
  bool copy_mark = 4;
}

message PrintQuotePdfRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string quote_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message PrintRepairOrderPdfRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string repair_order_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message PrintSettlementReceiptPdfRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string settlement_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message PrintPaymentVoucherPdfRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string settlement_id = 2 [(google.api.field_behavior) = REQUIRED];
  string payment_id = 3 [(google.api.field_behavior) = REQUIRED];
}

message PrintGoodsReceiptPdfRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string goods_receipt_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message PrintStockIssuePdfRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string repair_order_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// DocumentService renders PDFs and Excel reports on request (FRD 3.13).
// Every document is generated fresh from the owning module's own data, read
// through a narrow interface the same way every other cross-module read
// works (HLD Section 2: a module never queries another module's tables
// directly), with a built-in template per document type, paper size and
// version (Release 10.0; a garage designing its own templates is FR-DOC-03,
// Phase 14). Each RPC needs the same
// permission as the data it renders (quote.read, billing.read,
// inventory.read), not a permission of its own.
service DocumentService {
  // FR-DOC-01: the quote as a PDF, using the garage's standard layout.
  rpc ExportQuotePdf(ExportQuotePdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/quotes/{quote_id}/pdf"};
  }

  // FR-DOC-01: the repair order as a PDF, using the garage's standard
  // layout.
  rpc ExportRepairOrderPdf(ExportRepairOrderPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/repair-orders/{repair_order_id}/pdf"};
  }

  // FR-DOC-01: the settlement as a receipt PDF.
  rpc ExportSettlementReceiptPdf(ExportSettlementReceiptPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/settlements/{settlement_id}/receipt-pdf"};
  }

  // FR-BIL-05: one payment voucher (phiếu thu) as a PDF in the 01-TT
  // layout: the garage's legal header, amount in figures and words, and
  // signature blocks.
  rpc ExportPaymentVoucherPdf(ExportPaymentVoucherPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/settlements/{settlement_id}/payments/{payment_id}/voucher-pdf"};
  }

  // FR-DOC-02: the stock in/out/on-hand movement report (FR-INV-05) as an
  // Excel workbook; same filter as the JSON report
  // (InventoryService.ListStockTransactions).
  rpc ExportStockMovementsExcel(ExportStockMovementsExcelRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/reports/stock-movements/excel"};
  }

  // FR-DOC-02 (Release 6.0): the revenue-by-period report
  // (ReportingService.GetRevenueReport) as an Excel workbook.
  rpc ExportRevenueExcel(ExportRevenueExcelRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/reports/revenue/excel"};
  }

  // FR-INV-06 (Release 7.0): a goods receipt document as a PDF.
  rpc ExportGoodsReceiptPdf(ExportGoodsReceiptPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/goods-receipts/{goods_receipt_id}/pdf"};
  }

  // FR-INV-20 (Release 7.0): the repair order's stock issue document
  // (phiếu xuất kho) as a PDF.
  rpc ExportStockIssuePdf(ExportStockIssuePdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/repair-orders/{repair_order_id}/stock-issue/pdf"};
  }

  // FR-INV-12 (Release 7.1): a stock count as an Excel workbook for review
  // (counted against system quantity per line, with the value of the
  // difference when the caller has inventory.cost.read).
  rpc ExportStockCountExcel(ExportStockCountExcelRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/stock-counts/{stock_count_id}/excel"};
  }

  // FR-INV-19 (Release 7.0): the purchases-by-supplier report
  // (InventoryService.GetPurchasesReport) as an Excel workbook. Needs
  // inventory.cost.read.
  rpc ExportPurchasesExcel(ExportPurchasesExcelRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/reports/purchases/excel"};
  }

  // FR-INV-07 (Release 7.0): the stock valuation report
  // (InventoryService.GetStockValuationReport) as an Excel workbook. Needs
  // inventory.cost.read.
  rpc ExportStockValuationExcel(ExportStockValuationExcelRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/reports/stock-valuation/excel"};
  }

  // FR-DOC-04, FR-DOC-05 (Release 10.0): the garage's print choice for each
  // document type, defaults filled in. Needs membership of the garage.
  rpc GetPrintSettings(GetPrintSettingsRequest) returns (GetPrintSettingsResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/print-settings"};
  }

  // FR-DOC-04 (Release 10.0): replaces the paper size and the copy mark of
  // one document type; an omitted copy_mark means false, and the type is the
  // one in the path. An unspecified document type or paper size, and a size
  // the type has no template for, are refused (INVALID_ARGUMENT).
  rpc UpdatePrintSetting(UpdatePrintSettingRequest) returns (PrintSetting) {
    option (google.api.http) = {
      put: "/api/v1/garages/{garage_id}/print-settings/{document_type}"
      body: "*"
    };
  }

  // FR-DOC-05 (Release 10.0): the Print* RPCs render like the matching
  // Export*Pdf RPC (the garage's paper size, the template version of the
  // document's first print), add the copy mark of a reprint when the garage
  // turned it on, and write the print log. Each needs the permission of the
  // data it renders.
  rpc PrintQuotePdf(PrintQuotePdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {post: "/api/v1/garages/{garage_id}/quotes/{quote_id}/pdf:print"};
  }

  rpc PrintRepairOrderPdf(PrintRepairOrderPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {post: "/api/v1/garages/{garage_id}/repair-orders/{repair_order_id}/pdf:print"};
  }

  rpc PrintSettlementReceiptPdf(PrintSettlementReceiptPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {post: "/api/v1/garages/{garage_id}/settlements/{settlement_id}/receipt-pdf:print"};
  }

  rpc PrintPaymentVoucherPdf(PrintPaymentVoucherPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {post: "/api/v1/garages/{garage_id}/settlements/{settlement_id}/payments/{payment_id}/voucher-pdf:print"};
  }

  rpc PrintGoodsReceiptPdf(PrintGoodsReceiptPdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {post: "/api/v1/garages/{garage_id}/goods-receipts/{goods_receipt_id}/pdf:print"};
  }

  rpc PrintStockIssuePdf(PrintStockIssuePdfRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {post: "/api/v1/garages/{garage_id}/repair-orders/{repair_order_id}/stock-issue/pdf:print"};
  }
}
