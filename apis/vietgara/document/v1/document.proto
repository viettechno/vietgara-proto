// DocumentType is a document a garage can print (FR-DOC-04).
enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;
  DOCUMENT_TYPE_QUOTE = 1;
  DOCUMENT_TYPE_REPAIR_ORDER = 2;
  DOCUMENT_TYPE_SETTLEMENT = 3;
  DOCUMENT_TYPE_PAYMENT_VOUCHER = 4;
  DOCUMENT_TYPE_GOODS_RECEIPT = 5;
  DOCUMENT_TYPE_STOCK_ISSUE = 6;
  // Release 11.0 (FR-BIL-07): the payment-out voucher (phiếu chi).
  DOCUMENT_TYPE_PAYMENT_OUT_VOUCHER = 7;
  // Release 11.0 (FR-INV-16): the purchase order.
  DOCUMENT_TYPE_PURCHASE_ORDER = 8;
  // Release 13.0 (FR-INV-13): a part's barcode label. It has no print
  // setting and no print log; it is only a printer's default document type.
  DOCUMENT_TYPE_PART_LABEL = 9;
}

// PaperSize is the paper a document prints on: A4 (210 x 297 mm) or A5
// (148 x 210 mm) for a PDF; since Release 13.0 also the thermal rolls K80
// (80 mm, 72 mm printed) and K57 (57 mm, 48 mm printed) and the 50 x 30 mm
// label. A print setting takes A4 or A5 only.
// Every size has its own templates: a document is never scaled from one
// size to another.
enum PaperSize {
  PAPER_SIZE_UNSPECIFIED = 0;
  PAPER_SIZE_A4 = 1;
  PAPER_SIZE_A5 = 2;
  PAPER_SIZE_K80 = 3;
  PAPER_SIZE_K57 = 4;
  PAPER_SIZE_LABEL_50X30 = 5;
}

// PrintSetting is a garage's printing choice for one document type
// (FR-DOC-04). A garage that never changed it prints on A4 without the
// copy mark. Its paper is A4 or A5 only: a roll or a label is chosen at print
// time by the printer (Release 13.0).
message PrintSetting {
  DocumentType document_type = 1;
  PaperSize paper_size = 2;
  // Whether a reprint carries a "copy" mark.
  bool copy_mark = 3;
  // The page sizes (A4, A5) the document type has a PDF template for; never
  // a roll or a label.
  repeated PaperSize available_paper_sizes = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetPrintSettingsRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetPrintSettingsResponse {
  // One entry for each document type but PART_LABEL, defaults filled in.
  repeated PrintSetting settings = 1;
}

message UpdatePrintSettingRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  DocumentType document_type = 2 [(google.api.field_behavior) = REQUIRED];
  PaperSize paper_size = 3 [(google.api.field_behavior) = REQUIRED];
  bool copy_mark = 4;
}

