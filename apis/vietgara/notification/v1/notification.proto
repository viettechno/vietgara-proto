syntax = "proto3";

package vietgara.notification.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "vietgara/common/v1/pagination.proto";

option go_package = "github.com/viettechno/vietgara-proto/apis-go/vietgara/notification/v1;notificationv1";

// NotificationType is one e-mail a garage can switch off (FR-NOT-05,
// FR-INV-04).
enum NotificationType {
  NOTIFICATION_TYPE_UNSPECIFIED = 0;
  // Customer: the quote with the link to approve it. Essential.
  NOTIFICATION_TYPE_QUOTE_READY = 1;
  // Staff: a quote was approved or rejected.
  NOTIFICATION_TYPE_QUOTE_DECIDED = 2;
  // Customer: the vehicle is ready for pick-up.
  NOTIFICATION_TYPE_VEHICLE_READY = 3;
  // Customer: a payment was recorded and a balance is left.
  NOTIFICATION_TYPE_PAYMENT_RECEIVED = 4;
  // Customer: the settlement is paid; the receipt is attached. Essential.
  NOTIFICATION_TYPE_SETTLEMENT_RECEIPT = 5;
  // Staff: a settlement is fully paid.
  NOTIFICATION_TYPE_SETTLEMENT_PAID = 6;
  // Staff: a part fell to or under its reorder threshold.
  NOTIFICATION_TYPE_LOW_STOCK = 7;
}

enum NotificationAudience {
  NOTIFICATION_AUDIENCE_UNSPECIFIED = 0;
  NOTIFICATION_AUDIENCE_CUSTOMER = 1;
  NOTIFICATION_AUDIENCE_STAFF = 2;
}

enum NotificationStatus {
  NOTIFICATION_STATUS_UNSPECIFIED = 0;
  NOTIFICATION_STATUS_SENT = 1;
  NOTIFICATION_STATUS_FAILED = 2;
  NOTIFICATION_STATUS_SKIPPED = 3;
}

// NotificationSkipReason says why a notification was not sent.
enum NotificationSkipReason {
  NOTIFICATION_SKIP_REASON_UNSPECIFIED = 0;
  // The garage switched the type off.
  NOTIFICATION_SKIP_REASON_DISABLED = 1;
  // The customer opted out of non-essential e-mails.
  NOTIFICATION_SKIP_REASON_OPTED_OUT = 2;
  // The address bounced for good or complained.
  NOTIFICATION_SKIP_REASON_SUPPRESSED = 3;
  // The customer has no e-mail address.
  NOTIFICATION_SKIP_REASON_NO_EMAIL = 4;
}

message NotificationTypeSetting {
  NotificationType type = 1;
  bool enabled = 2;
  NotificationAudience audience = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // An essential e-mail carries what the customer needs to act and ignores a
  // customer's opt-out; the garage can still switch it off.
  bool essential = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message NotificationSettings {
  // The display name of the sender; empty means the garage's name.
  string sender_name = 1;
  // One entry for each type, defaults (enabled) filled in.
  repeated NotificationTypeSetting types = 2;
}

message GetNotificationSettingsRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateNotificationSettingsRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // At most 100 characters.
  string sender_name = 2;
  // The types to change; a type left out is switched on. An unspecified type
  // or a duplicate is refused (INVALID_ARGUMENT).
  repeated NotificationTypeSetting types = 3;
}

// NotificationLogEntry is one send, failed attempt or skip of a garage.
message NotificationLogEntry {
  string id = 1;
  NotificationType type = 2;
  string recipient = 3;
  string customer_id = 4;
  // What the e-mail is about, for example `quote` and the quote's id.
  string entity_type = 5;
  string entity_id = 6;
  NotificationStatus status = 7;
  NotificationSkipReason reason = 8;
  string error = 9;
  google.protobuf.Timestamp created_at = 10;
}

message ListNotificationLogRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Filters; unspecified means all.
  NotificationType type = 2;
  NotificationStatus status = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListNotificationLogResponse {
  repeated NotificationLogEntry data = 1;
  vietgara.common.v1.Pagination pagination = 2;
}

// NotificationService serves the garage's e-mail settings and delivery log
// (Release 10.1). The e-mails themselves are sent by consuming events, and
// the customer's opt-out page and the provider's webhook are plain HTTP
// routes, not RPCs.
service NotificationService {
  // Any member of the garage can read the settings (PERMISSION_GARAGE_READ).
  rpc GetNotificationSettings(GetNotificationSettingsRequest) returns (NotificationSettings) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/notification-settings"};
  }

  // Replaces the settings. Needs PERMISSION_GARAGE_WRITE.
  rpc UpdateNotificationSettings(UpdateNotificationSettingsRequest) returns (NotificationSettings) {
    option (google.api.http) = {
      put: "/api/v1/garages/{garage_id}/notification-settings"
      body: "*"
    };
  }

  // The garage's sends, newest first. Needs PERMISSION_GARAGE_WRITE: the
  // log holds customers' e-mail addresses.
  rpc ListNotificationLog(ListNotificationLogRequest) returns (ListNotificationLogResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/notification-log"};
  }
}
