syntax = "proto3";

package vietgara.tenant.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/type/dayofweek.proto";
import "vietgara/common/v1/bank_details.proto";
import "vietgara/common/v1/quote_approval_mode.proto";
import "vietgara/tenant/v1/access.proto";

option go_package = "github.com/viettechno/vietgara-proto/apis-go/vietgara/tenant/v1;tenantv1";

// GarageStatus: an inactive garage is hidden from staff and read-only for
// its owner until reactivated (FR-TEN-02).
enum GarageStatus {
  GARAGE_STATUS_UNSPECIFIED = 0;
  GARAGE_STATUS_ACTIVE = 1;
  GARAGE_STATUS_INACTIVE = 2;
}

// DailyHours is the opening time of one weekday (FR-TEN-05).
message DailyHours {
  google.type.DayOfWeek day = 1;
  // True when the garage does not open that day.
  bool closed = 2;
  // "HH:MM", 24-hour clock, garage timezone.
  string open = 3;
  string close = 4;
}

// NumberingTemplates configures document numbers (FR-TEN-05). Placeholders:
// {YYYY}, {YY}, {MM}, {DD} and {SEQ:n} (sequence padded to n digits),
// e.g. "BG-{YYYY}{MM}-{SEQ:4}".
message NumberingTemplates {
  string quote = 1;
  string repair_order = 2;
  // Settlement document numbers (Release 1.4).
  string settlement = 3;
  // Payment voucher (phiếu thu) numbers (FR-BIL-05, Release 5.0).
  string payment_voucher = 4;
}

// GarageAccess is what the signed-in user may do in the garage.
message GarageAccess {
  bool owner = 1;
  repeated Permission permissions = 2;
}

// Garage is one tenant (branch) owned by a user (FR-TEN-01/02).
message Garage {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string owner_user_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string name = 3 [(google.api.field_behavior) = REQUIRED];
  optional string tax_code = 4;
  optional string address = 5;
  optional string phone = 6;
  optional string email = 7;
  // Set through UploadGarageLogo; the logo is a file of the file registry.
  optional string logo_url = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // IANA timezone, default Asia/Ho_Chi_Minh.
  string timezone = 9;
  // ISO 4217, default VND.
  string currency = 10;
  GarageStatus status = 11;
  repeated DailyHours operating_hours = 12;
  NumberingTemplates numbering = 13;
  GarageAccess access = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The approval mode new quotes of this garage start with (FR-TEN-05,
  // Release 1.2); a service advisor may still change it per quote.
  // Default LINK.
  vietgara.common.v1.QuoteApprovalMode default_quote_approval_mode = 17;
  // The garage's legal identity, printed in the header of every document
  // with the logo and tax_code (FR-TEN-06). Changing it never rewrites a
  // document already issued: each document keeps a snapshot.
  optional string legal_name = 18;
  optional string legal_address = 19;
  // The legal representative.
  optional string representative = 20;
  vietgara.common.v1.BankDetails bank = 21;
}

message ListGaragesRequest {}

message ListGaragesResponse {
  // Garages the user owns or is an active member of; staff do not see
  // inactive garages.
  repeated Garage data = 1;
}

message CreateGarageRequest {
  Garage garage = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreateGarageResponse {
  Garage garage = 1;
}

message GetGarageRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetGarageResponse {
  Garage garage = 1;
}

message UpdateGarageRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  Garage garage = 2 [(google.api.field_behavior) = REQUIRED];
  // Filled from the JSON body keys when omitted. Only the owner may change
  // status.
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateGarageResponse {
  Garage garage = 1;
}

message UploadGarageLogoRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // PNG, JPEG or WebP image, at most 1 MB (base64 in JSON).
  bytes content = 2 [(google.api.field_behavior) = REQUIRED];
  // image/png, image/jpeg or image/webp.
  string content_type = 3 [(google.api.field_behavior) = REQUIRED];
}

message UploadGarageLogoResponse {
  Garage garage = 1;
}

message DeleteGarageLogoRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message DeleteGarageLogoResponse {
  Garage garage = 1;
}

// GarageService manages garages (FRD 3.2).
service GarageService {
  rpc ListGarages(ListGaragesRequest) returns (ListGaragesResponse) {
    option (google.api.http) = {get: "/api/v1/garages"};
  }

  // Creates a garage owned by the signed-in user, within the plan's
  // garage limit.
  rpc CreateGarage(CreateGarageRequest) returns (CreateGarageResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages"
      body: "garage"
      response_body: "garage"
    };
  }

  rpc GetGarage(GetGarageRequest) returns (GetGarageResponse) {
    option (google.api.http) = {
      get: "/api/v1/garages/{garage_id}"
      response_body: "garage"
    };
  }

  rpc UpdateGarage(UpdateGarageRequest) returns (UpdateGarageResponse) {
    option (google.api.http) = {
      patch: "/api/v1/garages/{garage_id}"
      body: "garage"
      response_body: "garage"
    };
  }

  // Replaces the garage logo.
  rpc UploadGarageLogo(UploadGarageLogoRequest) returns (UploadGarageLogoResponse) {
    option (google.api.http) = {
      put: "/api/v1/garages/{garage_id}/logo"
      body: "*"
      response_body: "garage"
    };
  }

  rpc DeleteGarageLogo(DeleteGarageLogoRequest) returns (DeleteGarageLogoResponse) {
    option (google.api.http) = {
      delete: "/api/v1/garages/{garage_id}/logo"
      response_body: "garage"
    };
  }
}
