syntax = "proto3";

package vietgara.tenant.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "vietgara/tenant/v1/access.proto";

option go_package = "github.com/viettechno/vietgara-proto/apis-go/vietgara/tenant/v1;tenantv1";

// StaffStatus: inactive staff keep their record but lose access.
enum StaffStatus {
  STAFF_STATUS_UNSPECIFIED = 0;
  STAFF_STATUS_ACTIVE = 1;
  STAFF_STATUS_INACTIVE = 2;
}

// Staff is a user's membership of a garage (FR-TEN-04).
message Staff {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string garage_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string user_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string full_name = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string email = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  optional string phone = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The garage owner; cannot be deactivated, removed or grouped.
  bool owner = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  StaffStatus status = 8;
  // Staff groups of this garage the member belongs to.
  repeated string group_ids = 9;
  // Union of the permissions of the member's groups.
  repeated Permission permissions = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// CandidateMembership is where a looked-up user stands with the garage.
enum CandidateMembership {
  CANDIDATE_MEMBERSHIP_UNSPECIFIED = 0;
  CANDIDATE_MEMBERSHIP_NONE = 1;
  CANDIDATE_MEMBERSHIP_MEMBER = 2;
  CANDIDATE_MEMBERSHIP_INVITED = 3;
}

// StaffCandidate is an existing user found by e-mail or phone.
message StaffCandidate {
  string user_id = 1;
  string full_name = 2;
  string email = 3;
  optional string phone = 4;
  CandidateMembership membership = 5;
}

message ListStaffRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListStaffResponse {
  repeated Staff data = 1;
}

message UpdateStaffRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string staff_id = 2 [(google.api.field_behavior) = REQUIRED];
  // status and group_ids.
  Staff staff = 3 [(google.api.field_behavior) = REQUIRED];
  // Filled from the JSON body keys when omitted.
  google.protobuf.FieldMask update_mask = 4;
}

message UpdateStaffResponse {
  Staff staff = 1;
}

message DeleteStaffRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string staff_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeleteStaffResponse {}

message LookupStaffCandidateRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Exact e-mail address or phone number of an existing user.
  string query = 2 [(google.api.field_behavior) = REQUIRED];
}

message LookupStaffCandidateResponse {
  StaffCandidate candidate = 1;
}

// StaffService manages a garage's members. Reads need
// PERMISSION_STAFF_READ, changes PERMISSION_STAFF_WRITE. Members join
// through InvitationService.
service StaffService {
  rpc ListStaff(ListStaffRequest) returns (ListStaffResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/staff"};
  }

  // Activates/deactivates a member or changes their groups.
  rpc UpdateStaff(UpdateStaffRequest) returns (UpdateStaffResponse) {
    option (google.api.http) = {
      patch: "/api/v1/garages/{garage_id}/staff/{staff_id}"
      body: "staff"
      response_body: "staff"
    };
  }

  // Removes a member from the garage.
  rpc DeleteStaff(DeleteStaffRequest) returns (DeleteStaffResponse) {
    option (google.api.http) = {delete: "/api/v1/garages/{garage_id}/staff/{staff_id}"};
  }

  // Finds an existing user by exact e-mail or phone to invite.
  rpc LookupStaffCandidate(LookupStaffCandidateRequest) returns (LookupStaffCandidateResponse) {
    option (google.api.http) = {
      get: "/api/v1/garages/{garage_id}/staff-candidates"
      response_body: "candidate"
    };
  }
}
