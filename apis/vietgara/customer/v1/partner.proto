syntax = "proto3";

package vietgara.customer.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "vietgara/common/v1/pagination.proto";

option go_package = "github.com/viettechno/vietgara-proto/apis-go/vietgara/customer/v1;customerv1";

enum PartnerType {
  PARTNER_TYPE_UNSPECIFIED = 0;
  PARTNER_TYPE_SUPPLIER = 1;
  PARTNER_TYPE_INSURER = 2;
}

message PartnerContact {
  optional string contact_person = 1;
  optional string phone = 2;
  optional string email = 3;
  optional string address = 4;
}

// Partner is a parts supplier or insurer in the garage's directory
// (FR-CUS-04).
message Partner {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string garage_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  PartnerType type = 3 [(google.api.field_behavior) = REQUIRED];
  // Unique per garage and type (case-insensitive).
  string name = 4 [(google.api.field_behavior) = REQUIRED];
  optional string tax_code = 5;
  PartnerContact contact = 6;
  optional string note = 7;
  google.protobuf.Timestamp created_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message CreatePartnerRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  Partner partner = 2 [(google.api.field_behavior) = REQUIRED];
}

message CreatePartnerResponse {
  Partner partner = 1;
}

message GetPartnerRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string partner_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message GetPartnerResponse {
  Partner partner = 1;
}

message UpdatePartnerRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string partner_id = 2 [(google.api.field_behavior) = REQUIRED];
  Partner partner = 3 [(google.api.field_behavior) = REQUIRED];
  // Filled from the JSON body keys when omitted; "contact" replaces the
  // whole contact block.
  google.protobuf.FieldMask update_mask = 4;
}

message UpdatePartnerResponse {
  Partner partner = 1;
}

message ListPartnersRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  PartnerType type = 2;
  // Matches name, tax code or contact.
  string query = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListPartnersResponse {
  repeated Partner data = 1;
  vietgara.common.v1.Pagination pagination = 2;
}

message DeletePartnerRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string partner_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeletePartnerResponse {}

// PartnerService manages suppliers and insurers (FR-CUS-04). Reads need
// PERMISSION_PARTNER_READ, changes PERMISSION_PARTNER_WRITE.
service PartnerService {
  rpc ListPartners(ListPartnersRequest) returns (ListPartnersResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/partners"};
  }

  rpc CreatePartner(CreatePartnerRequest) returns (CreatePartnerResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/partners"
      body: "partner"
      response_body: "partner"
    };
  }

  rpc GetPartner(GetPartnerRequest) returns (GetPartnerResponse) {
    option (google.api.http) = {
      get: "/api/v1/garages/{garage_id}/partners/{partner_id}"
      response_body: "partner"
    };
  }

  rpc UpdatePartner(UpdatePartnerRequest) returns (UpdatePartnerResponse) {
    option (google.api.http) = {
      patch: "/api/v1/garages/{garage_id}/partners/{partner_id}"
      body: "partner"
      response_body: "partner"
    };
  }

  rpc DeletePartner(DeletePartnerRequest) returns (DeletePartnerResponse) {
    option (google.api.http) = {delete: "/api/v1/garages/{garage_id}/partners/{partner_id}"};
  }
}
