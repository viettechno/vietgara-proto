syntax = "proto3";

package vietgara.license.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "vietgara/common/v1/pagination.proto";

option go_package = "github.com/viettechno/vietgara-proto/apis-go/vietgara/license/v1;licensev1";

enum BillingCycle {
  BILLING_CYCLE_UNSPECIFIED = 0;
  BILLING_CYCLE_MONTHLY = 1;
  BILLING_CYCLE_YEARLY = 2;
}

// SubscriptionStatus (LLD 3.1): past_due is read-only during the grace
// period, suspended and cancelled are locked.
enum SubscriptionStatus {
  SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  SUBSCRIPTION_STATUS_TRIAL = 1;
  SUBSCRIPTION_STATUS_ACTIVE = 2;
  SUBSCRIPTION_STATUS_PAST_DUE = 3;
  SUBSCRIPTION_STATUS_SUSPENDED = 4;
  SUBSCRIPTION_STATUS_CANCELLED = 5;
}

// Feature is a module a plan may include.
enum Feature {
  FEATURE_UNSPECIFIED = 0;
  FEATURE_CUSTOMERS = 1;
  FEATURE_QUOTES = 2;
  FEATURE_REPAIR_ORDERS = 3;
  FEATURE_INVENTORY = 4;
  FEATURE_BILLING = 5;
  FEATURE_DOCUMENTS = 6;
  FEATURE_REPORTS = 7;
}

// PlanLimits caps usage across all garages of the subscribing owner.
message PlanLimits {
  int32 max_garages = 1;
  // Staff members across all garages, excluding the owner and counting
  // pending invitations.
  int32 max_staff = 2;
  // Business documents (quotes, repair orders, settlements) created per
  // calendar day (Asia/Ho_Chi_Minh).
  int32 max_transactions_per_day = 3;
}

// Plan is a subscription offer (FR-LIC-05).
message Plan {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Unique, e.g. "pro"; "trial" is the plan every new owner starts on.
  string code = 2 [(google.api.field_behavior) = REQUIRED];
  string name = 3 [(google.api.field_behavior) = REQUIRED];
  string description = 4;
  // Price per billing cycle in the smallest currency unit (VND).
  int64 price = 5;
  string currency = 6;
  BillingCycle billing_cycle = 7;
  PlanLimits limits = 8 [(google.api.field_behavior) = REQUIRED];
  repeated Feature features = 9;
  // Shown to garage owners.
  bool is_public = 10;
  // Inactive plans cannot be chosen; existing subscribers keep them.
  bool is_active = 11;
  int32 sort_order = 12;
  google.protobuf.Timestamp created_at = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// PlanPaymentKind says what a payment request pays for (FR-LIC-07).
enum PlanPaymentKind {
  PLAN_PAYMENT_KIND_UNSPECIFIED = 0;
  // Another plan.
  PLAN_PAYMENT_KIND_CHANGE = 1;
  // The current plan for another period.
  PLAN_PAYMENT_KIND_RENEW = 2;
}

// PlanPaymentStatus is the state of a payment request (LLD 3.3).
enum PlanPaymentStatus {
  PLAN_PAYMENT_STATUS_UNSPECIFIED = 0;
  // Quoted, with its transfer reference; the owner has not declared the
  // transfer yet. A new request replaces it.
  PLAN_PAYMENT_STATUS_AWAITING_PAYMENT = 1;
  // The owner declared the transfer; a platform admin reviews it.
  PLAN_PAYMENT_STATUS_SUBMITTED = 2;
  // Approved: the plan applied at once.
  PLAN_PAYMENT_STATUS_APPROVED = 3;
  PLAN_PAYMENT_STATUS_REJECTED = 4;
  PLAN_PAYMENT_STATUS_CANCELLED = 5;
}

// CreditEntryKind is why the account credit changed (FR-LIC-09).
enum CreditEntryKind {
  CREDIT_ENTRY_KIND_UNSPECIFIED = 0;
  // A downgrade's surplus.
  CREDIT_ENTRY_KIND_EARNED = 1;
  // Credit used by a payment.
  CREDIT_ENTRY_KIND_APPLIED = 2;
  // A correction by a platform admin.
  CREDIT_ENTRY_KIND_ADJUSTMENT = 3;
}

// PaymentInstructions are the platform's payment details shown with a
// payment request (FR-LIC-10).
message PaymentInstructions {
  string bank_name = 1;
  string account_number = 2;
  string account_holder = 3;
  string branch = 4;
  string transfer_instructions = 5;
  // The QR code image, a signed URL valid for 5 minutes; empty when none.
  string qr_url = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// PlanPaymentRequest is an owner's request to switch to a plan, or to renew
// the current one, paid by a manual bank transfer (FR-LIC-07). The amounts
// are fixed when it is quoted and honoured at approval.
message PlanPaymentRequest {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  PlanPaymentKind kind = 2;
  // The plan to pay for.
  Plan plan = 3;
  PlanPaymentStatus status = 4;
  // The code the owner puts in the transfer note, e.g. "VG-7K2M9Q".
  string reference = 5;
  // New plan price, account credit applied, amount to transfer and any
  // surplus that becomes credit (VND, FR-LIC-09).
  int64 quoted_amount = 6;
  int64 credit_applied = 7;
  int64 amount_due = 8;
  int64 credit_surplus = 9;
  // Days of the current period and how many are unused (0 after expiry).
  int32 period_days = 10;
  int32 unused_days = 11;
  // The payment details shown when the request was quoted.
  PaymentInstructions instructions = 12;
  // The owner's declaration, set once submitted.
  string payer_name = 13;
  string payer_bank = 14;
  string payer_account = 15;
  int64 transferred_amount = 16;
  string bank_transaction_ref = 17;
  google.protobuf.Timestamp paid_at = 18;
  // The evidence screenshot, a signed URL valid for 5 minutes.
  string evidence_url = 19 [(google.api.field_behavior) = OUTPUT_ONLY];
  // True when the transferred amount differs from amount_due.
  bool amount_mismatch = 20;
  // The admin's note on approval (required when amount_mismatch).
  string review_note = 21;
  string rejection_reason = 22;
  google.protobuf.Timestamp submitted_at = 23;
  google.protobuf.Timestamp reviewed_at = 24;
  google.protobuf.Timestamp created_at = 25;
}

// CreditLedgerEntry is one change of the owner's account credit.
message CreditLedgerEntry {
  CreditEntryKind kind = 1;
  // Signed VND: positive adds credit, negative uses it.
  int64 amount = 2;
  int64 balance_after = 3;
  string plan_payment_request_id = 4;
  string note = 5;
  google.protobuf.Timestamp created_at = 6;
}

// Usage is the owner's current consumption of the plan limits.
message Usage {
  int32 garages = 1;
  int32 staff = 2;
  int32 transactions_today = 3;
}

// Subscription belongs to an owner user and covers all their garages
// (FR-LIC-01..04).
message Subscription {
  string id = 1;
  string user_id = 2;
  SubscriptionStatus status = 3;
  Plan plan = 4;
  google.protobuf.Timestamp trial_end_at = 5;
  google.protobuf.Timestamp current_period_start = 6;
  google.protobuf.Timestamp current_period_end = 7;
  google.protobuf.Timestamp grace_period_end = 8;
  bool auto_renew = 9;
  Usage usage = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  // Account credit in VND (FR-LIC-09), applied to the next payment.
  int64 credit_balance = 13;
  // What was paid for the current period (0 for a trial); the basis of the
  // credit when the plan is changed.
  int64 period_paid_amount = 14;
  // The request awaiting payment or review, unset when none.
  PlanPaymentRequest open_request = 15;
}

// Entitlements is what a garage may currently use, derived from its
// owner's subscription; the web admin uses it to lock UI.
message Entitlements {
  string garage_id = 1;
  SubscriptionStatus status = 2;
  string plan_code = 3;
  repeated Feature features = 4;
  PlanLimits limits = 5;
  bool read_only = 6;
  google.protobuf.Timestamp current_period_end = 7;
}

message ListPlansRequest {}

message ListPlansResponse {
  // Public, active plans, cheapest first.
  repeated Plan data = 1;
}

message GetMySubscriptionRequest {}

message GetMySubscriptionResponse {
  Subscription subscription = 1;
}

message CreatePlanPaymentRequestRequest {
  string plan_id = 1 [(google.api.field_behavior) = REQUIRED];
  PlanPaymentKind kind = 2 [(google.api.field_behavior) = REQUIRED];
}

message CreatePlanPaymentRequestResponse {
  PlanPaymentRequest request = 1;
}

message ListMyPlanPaymentRequestsRequest {
  // Optional filter.
  PlanPaymentStatus status = 1;
}

message ListMyPlanPaymentRequestsResponse {
  repeated PlanPaymentRequest data = 1;
}

message GetMyPlanPaymentRequestRequest {
  string request_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetMyPlanPaymentRequestResponse {
  PlanPaymentRequest request = 1;
}

// PaymentEvidence is the screenshot of the transfer.
message PaymentEvidence {
  bytes content = 1 [(google.api.field_behavior) = REQUIRED];
  // image/png, image/jpeg, image/webp or application/pdf, at most 5 MB.
  string content_type = 2 [(google.api.field_behavior) = REQUIRED];
}

message SubmitPlanPaymentRequest {
  string request_id = 1 [(google.api.field_behavior) = REQUIRED];
  string payer_name = 2 [(google.api.field_behavior) = REQUIRED];
  string payer_bank = 3;
  string payer_account = 4;
  int64 transferred_amount = 5 [(google.api.field_behavior) = REQUIRED];
  string bank_transaction_ref = 6;
  google.protobuf.Timestamp paid_at = 7;
  // Required unless the amount due is 0.
  PaymentEvidence evidence = 8;
}

message SubmitPlanPaymentResponse {
  PlanPaymentRequest request = 1;
}

message CancelPlanPaymentRequest {
  string request_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message CancelPlanPaymentResponse {
  PlanPaymentRequest request = 1;
}

message ListMyCreditLedgerRequest {}

message ListMyCreditLedgerResponse {
  repeated CreditLedgerEntry data = 1;
}

message GetPaymentInstructionsRequest {}

message GetPaymentInstructionsResponse {
  PaymentInstructions instructions = 1;
}

message GetGarageEntitlementsRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetGarageEntitlementsResponse {
  Entitlements entitlements = 1;
}

// LicenseService is the garage-facing side of License Management.
service LicenseService {
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse) {
    option (google.api.http) = {get: "/api/v1/plans"};
  }

  // The signed-in owner's subscription and usage.
  rpc GetMySubscription(GetMySubscriptionRequest) returns (GetMySubscriptionResponse) {
    option (google.api.http) = {
      get: "/api/v1/me/subscription"
      response_body: "subscription"
    };
  }

  // Starts a plan change or a renewal (FR-LIC-07): validates the owner's
  // usage against the plan's limits (PLAN_LIMIT_REACHED), quotes the amount
  // with the account credit applied (FR-LIC-09) and returns the transfer
  // reference and the platform's payment details. TRIAL_NOT_AVAILABLE for
  // the trial plan, PLAN_NOT_AVAILABLE for a plan that cannot be chosen,
  // REQUEST_ALREADY_OPEN while a request is SUBMITTED; a request still
  // AWAITING_PAYMENT is replaced.
  rpc CreatePlanPaymentRequest(CreatePlanPaymentRequestRequest) returns (CreatePlanPaymentRequestResponse) {
    option (google.api.http) = {
      post: "/api/v1/me/subscription/payment-requests"
      body: "*"
      response_body: "request"
    };
  }

  rpc ListMyPlanPaymentRequests(ListMyPlanPaymentRequestsRequest) returns (ListMyPlanPaymentRequestsResponse) {
    option (google.api.http) = {get: "/api/v1/me/subscription/payment-requests"};
  }

  rpc GetMyPlanPaymentRequest(GetMyPlanPaymentRequestRequest) returns (GetMyPlanPaymentRequestResponse) {
    option (google.api.http) = {
      get: "/api/v1/me/subscription/payment-requests/{request_id}"
      response_body: "request"
    };
  }

  // Declares the transfer with its evidence (EVIDENCE_REQUIRED when the
  // amount due is not 0); the platform admins are notified.
  rpc SubmitPlanPayment(SubmitPlanPaymentRequest) returns (SubmitPlanPaymentResponse) {
    option (google.api.http) = {
      post: "/api/v1/me/subscription/payment-requests/{request_id}:submit"
      body: "*"
      response_body: "request"
    };
  }

  // Cancels a request that is AWAITING_PAYMENT or SUBMITTED;
  // REQUEST_NOT_OPEN once reviewed.
  rpc CancelPlanPayment(CancelPlanPaymentRequest) returns (CancelPlanPaymentResponse) {
    option (google.api.http) = {
      post: "/api/v1/me/subscription/payment-requests/{request_id}:cancel"
      body: "*"
      response_body: "request"
    };
  }

  rpc ListMyCreditLedger(ListMyCreditLedgerRequest) returns (ListMyCreditLedgerResponse) {
    option (google.api.http) = {get: "/api/v1/me/subscription/credit-ledger"};
  }

  // The platform's payment details (FR-LIC-10).
  rpc GetPaymentInstructions(GetPaymentInstructionsRequest) returns (GetPaymentInstructionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/payment-settings"
      response_body: "instructions"
    };
  }

  // What the garage may use; any active member may read it.
  rpc GetGarageEntitlements(GetGarageEntitlementsRequest) returns (GetGarageEntitlementsResponse) {
    option (google.api.http) = {
      get: "/api/v1/garages/{garage_id}/entitlements"
      response_body: "entitlements"
    };
  }
}

// SubscriptionSummary is one row of the platform admin's subscription list.
message SubscriptionSummary {
  Subscription subscription = 1;
  string user_email = 2;
  string user_name = 3;
}

message ListAllPlansRequest {}

message ListAllPlansResponse {
  repeated Plan data = 1;
}

message CreatePlanRequest {
  Plan plan = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreatePlanResponse {
  Plan plan = 1;
}

message UpdatePlanRequest {
  string plan_id = 1 [(google.api.field_behavior) = REQUIRED];
  Plan plan = 2 [(google.api.field_behavior) = REQUIRED];
  // Filled from the JSON body keys when omitted; code is immutable.
  google.protobuf.FieldMask update_mask = 3;
}

message UpdatePlanResponse {
  Plan plan = 1;
}

message ListSubscriptionsRequest {
  // Matches the owner's e-mail or name.
  string query = 1;
  SubscriptionStatus status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListSubscriptionsResponse {
  repeated SubscriptionSummary data = 1;
  vietgara.common.v1.Pagination pagination = 2;
}

message ExtendSubscriptionRequest {
  string subscription_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 1 to 366 days added to the current period end (or to now when
  // already expired); reactivates past-due and suspended subscriptions.
  int32 days = 2 [(google.api.field_behavior) = REQUIRED];
}

message ExtendSubscriptionResponse {
  Subscription subscription = 1;
}

// AdminPlanPaymentRequest is one row of the platform admin's review queue.
message AdminPlanPaymentRequest {
  PlanPaymentRequest request = 1;
  string subscription_id = 2;
  string user_email = 3;
  string user_name = 4;
  // The owner's current plan and usage, to judge the request.
  Plan current_plan = 5;
  Usage usage = 6;
}

message ListPlanPaymentRequestsRequest {
  // Defaults to SUBMITTED, oldest first.
  PlanPaymentStatus status = 1;
  // Matches the owner's e-mail or name, or the transfer reference.
  string query = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListPlanPaymentRequestsResponse {
  repeated AdminPlanPaymentRequest data = 1;
  vietgara.common.v1.Pagination pagination = 2;
}

message GetPlanPaymentRequestRequest {
  string request_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetPlanPaymentRequestResponse {
  AdminPlanPaymentRequest request = 1;
}

message ApprovePlanPaymentRequest {
  string request_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Required when the amount transferred differs from the amount due
  // (AMOUNT_MISMATCH_NOTE_REQUIRED).
  string note = 2;
}

message ApprovePlanPaymentResponse {
  // The owner's subscription with the new plan and period.
  Subscription subscription = 1;
}

message RejectPlanPaymentRequest {
  string request_id = 1 [(google.api.field_behavior) = REQUIRED];
  string reason = 2 [(google.api.field_behavior) = REQUIRED];
}

message RejectPlanPaymentResponse {
  PlanPaymentRequest request = 1;
}

message AdjustCreditRequest {
  string subscription_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Signed VND; the balance never goes below 0.
  int64 amount = 2 [(google.api.field_behavior) = REQUIRED];
  string note = 3 [(google.api.field_behavior) = REQUIRED];
}

message AdjustCreditResponse {
  CreditLedgerEntry entry = 1;
}

// PlatformPaymentSettings are the details owners transfer to (FR-LIC-10).
message PlatformPaymentSettings {
  string bank_name = 1;
  string account_number = 2;
  string account_holder = 3;
  string branch = 4;
  string transfer_instructions = 5;
  // The QR code, a signed URL valid for 5 minutes; empty when none.
  string qr_url = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetPlatformPaymentSettingsRequest {}

message GetPlatformPaymentSettingsResponse {
  PlatformPaymentSettings settings = 1;
}

message UpdatePlatformPaymentSettingsRequest {
  PlatformPaymentSettings settings = 1 [(google.api.field_behavior) = REQUIRED];
  // Filled from the JSON body keys when omitted.
  google.protobuf.FieldMask update_mask = 2;
}

message UpdatePlatformPaymentSettingsResponse {
  PlatformPaymentSettings settings = 1;
}

message UploadPaymentQrRequest {
  bytes content = 1 [(google.api.field_behavior) = REQUIRED];
  // image/png, image/jpeg or image/webp, at most 1 MB.
  string content_type = 2 [(google.api.field_behavior) = REQUIRED];
}

message UploadPaymentQrResponse {
  PlatformPaymentSettings settings = 1;
}

// LicenseAdminService is for platform admins only (FR-LIC-05, FR-LIC-08, FR-LIC-10).
service LicenseAdminService {
  // Every plan, including hidden and inactive ones.
  rpc ListAllPlans(ListAllPlansRequest) returns (ListAllPlansResponse) {
    option (google.api.http) = {get: "/api/v1/admin/plans"};
  }

  rpc CreatePlan(CreatePlanRequest) returns (CreatePlanResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/plans"
      body: "plan"
      response_body: "plan"
    };
  }

  rpc UpdatePlan(UpdatePlanRequest) returns (UpdatePlanResponse) {
    option (google.api.http) = {
      patch: "/api/v1/admin/plans/{plan_id}"
      body: "plan"
      response_body: "plan"
    };
  }

  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/subscriptions"};
  }

  // A correction: renewals and plan changes go through payment requests.
  rpc ExtendSubscription(ExtendSubscriptionRequest) returns (ExtendSubscriptionResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/subscriptions/{subscription_id}/extensions"
      body: "*"
      response_body: "subscription"
    };
  }

  // The review queue (FR-LIC-08).
  rpc ListPlanPaymentRequests(ListPlanPaymentRequestsRequest) returns (ListPlanPaymentRequestsResponse) {
    option (google.api.http) = {get: "/api/v1/admin/plan-payment-requests"};
  }

  rpc GetPlanPaymentRequest(GetPlanPaymentRequestRequest) returns (GetPlanPaymentRequestResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/plan-payment-requests/{request_id}"
      response_body: "request"
    };
  }

  // Approves the payment: the plan applies at once and a new period starts;
  // the limits are validated again (PLAN_LIMIT_REACHED).
  // REQUEST_NOT_OPEN unless SUBMITTED.
  rpc ApprovePlanPayment(ApprovePlanPaymentRequest) returns (ApprovePlanPaymentResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/plan-payment-requests/{request_id}:approve"
      body: "*"
      response_body: "subscription"
    };
  }

  rpc RejectPlanPayment(RejectPlanPaymentRequest) returns (RejectPlanPaymentResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/plan-payment-requests/{request_id}:reject"
      body: "*"
      response_body: "request"
    };
  }

  rpc AdjustCredit(AdjustCreditRequest) returns (AdjustCreditResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/subscriptions/{subscription_id}/credit-adjustments"
      body: "*"
      response_body: "entry"
    };
  }

  rpc GetPlatformPaymentSettings(GetPlatformPaymentSettingsRequest) returns (GetPlatformPaymentSettingsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/payment-settings"
      response_body: "settings"
    };
  }

  rpc UpdatePlatformPaymentSettings(UpdatePlatformPaymentSettingsRequest) returns (UpdatePlatformPaymentSettingsResponse) {
    option (google.api.http) = {
      patch: "/api/v1/admin/payment-settings"
      body: "settings"
      response_body: "settings"
    };
  }

  // Uploads or replaces the QR code image.
  rpc UploadPaymentQr(UploadPaymentQrRequest) returns (UploadPaymentQrResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/payment-settings/qr"
      body: "*"
      response_body: "settings"
    };
  }
}
