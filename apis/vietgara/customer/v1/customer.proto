syntax = "proto3";

package vietgara.customer.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "vietgara/common/v1/lifecycle.proto";
import "vietgara/common/v1/pagination.proto";

option go_package = "github.com/viettechno/vietgara-proto/apis-go/vietgara/customer/v1;customerv1";

// CustomerUserLinkStatus is the state of the link between a garage's
// customer profile and a VietGara user (FR-CUS-06). A customer needs no
// user; UNSPECIFIED means the profile has never been linked.
enum CustomerUserLinkStatus {
  CUSTOMER_USER_LINK_STATUS_UNSPECIFIED = 0;
  // The garage asked; the user has not answered yet.
  CUSTOMER_USER_LINK_STATUS_REQUESTED = 1;
  CUSTOMER_USER_LINK_STATUS_LINKED = 2;
  CUSTOMER_USER_LINK_STATUS_DECLINED = 3;
  // Ended by either side.
  CUSTOMER_USER_LINK_STATUS_UNLINKED = 4;
}

// Customer is a vehicle owner served by one garage (FR-CUS-01). It needs no
// VietGara user: a walk-in customer is just a profile the garage keeps.
message Customer {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string garage_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string full_name = 3 [(google.api.field_behavior) = REQUIRED];
  // Unique per garage among live customers; stored normalized.
  optional string phone = 4;
  optional string email = 5;
  optional string address = 6;
  // Personal-data consent (Decree 13/2023/ND-CP); every change is logged.
  bool personal_data_consent = 7;
  google.protobuf.Timestamp personal_data_consent_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  int32 vehicle_count = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // False once the customer was deactivated instead of deleted (FR-CAT-07);
  // an inactive customer is left out of pickers.
  bool is_active = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The state of the link with a user, UNSPECIFIED when never linked.
  CustomerUserLinkStatus link_status = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message CreateCustomerRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  Customer customer = 2 [(google.api.field_behavior) = REQUIRED];
}

message CreateCustomerResponse {
  Customer customer = 1;
}

message GetCustomerRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string customer_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message GetCustomerResponse {
  Customer customer = 1;
}

message UpdateCustomerRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string customer_id = 2 [(google.api.field_behavior) = REQUIRED];
  Customer customer = 3 [(google.api.field_behavior) = REQUIRED];
  // Filled from the JSON body keys when omitted.
  google.protobuf.FieldMask update_mask = 4;
}

message UpdateCustomerResponse {
  Customer customer = 1;
}

message ListCustomersRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Fuzzy match on name, phone or e-mail.
  string query = 2;
  int32 page = 3;
  int32 page_size = 4;
  // Also list deactivated customers (staff screens); pickers leave it off.
  bool include_inactive = 5;
}

message ListCustomersResponse {
  repeated Customer data = 1;
  vietgara.common.v1.Pagination pagination = 2;
}

message DeleteCustomerRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string customer_id = 2 [(google.api.field_behavior) = REQUIRED];
  // Answer the outcome without changing anything (`?dryRun=true`).
  bool dry_run = 3;
}

message DeleteCustomerResponse {
  vietgara.common.v1.DeleteOutcome outcome = 1;
}

message ActivateCustomerRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string customer_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message ActivateCustomerResponse {
  Customer customer = 1;
}

message LookupCustomersRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Either or both; the garage's customers matching any of them are listed.
  string phone = 2;
  string email = 3;
}

message LookupCustomersResponse {
  // The garage's own customers matching the contact.
  repeated Customer data = 1;
  // Whether a VietGara user has this verified phone or e-mail. Nothing else
  // about the user is ever returned.
  bool user_exists = 2;
}

// CustomerService manages a garage's customers (FRD 3.4). Reads need
// PERMISSION_CUSTOMER_READ, changes PERMISSION_CUSTOMER_WRITE.
service CustomerService {
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/customers"};
  }

  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/customers"
      body: "customer"
      response_body: "customer"
    };
  }

  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse) {
    option (google.api.http) = {
      get: "/api/v1/garages/{garage_id}/customers/{customer_id}"
      response_body: "customer"
    };
  }

  rpc UpdateCustomer(UpdateCustomerRequest) returns (UpdateCustomerResponse) {
    option (google.api.http) = {
      patch: "/api/v1/garages/{garage_id}/customers/{customer_id}"
      body: "customer"
      response_body: "customer"
    };
  }

  // Follows the delete-or-deactivate rule (FR-CAT-07): a customer that
  // quotes, repair orders or settlements refer to is deactivated, otherwise
  // the customer and their vehicles are soft-deleted.
  rpc DeleteCustomer(DeleteCustomerRequest) returns (DeleteCustomerResponse) {
    option (google.api.http) = {delete: "/api/v1/garages/{garage_id}/customers/{customer_id}"};
  }

  // Reactivates a deactivated customer.
  rpc ActivateCustomer(ActivateCustomerRequest) returns (ActivateCustomerResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/customers/{customer_id}:activate"
      body: "*"
      response_body: "customer"
    };
  }

  // FR-CUS-06: finds the garage's customers by phone or e-mail while a quote
  // is being prepared, and tells whether a user exists. Declared last so
  // that the gateway matches /customers/lookup before /customers/{id}.
  rpc LookupCustomers(LookupCustomersRequest) returns (LookupCustomersResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/customers/lookup"};
  }
}
