syntax = "proto3";

package vietgara.inventory.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "vietgara/common/v1/pagination.proto";

option go_package = "github.com/viettechno/vietgara-proto/apis-go/vietgara/inventory/v1;inventoryv1";

// StockTransactionType: a movement either adds to stock or removes from it.
enum StockTransactionType {
  STOCK_TRANSACTION_TYPE_UNSPECIFIED = 0;
  STOCK_TRANSACTION_TYPE_IN = 1;
  STOCK_TRANSACTION_TYPE_OUT = 2;
}

// StockTransactionRefType names what caused a stock movement.
enum StockTransactionRefType {
  STOCK_TRANSACTION_REF_TYPE_UNSPECIFIED = 0;
  // A manual stock receipt from a supplier (FR-INV-01). Superseded in
  // Release 7.0 by GOODS_RECEIPT, kept for movements recorded before it.
  STOCK_TRANSACTION_REF_TYPE_PURCHASE = 1;
  // Automatic deduction when a repair order with part lines closes
  // (FR-INV-02). Superseded in Release 7.0 by STOCK_ISSUE.
  STOCK_TRANSACTION_REF_TYPE_REPAIR_ORDER = 2;
  // A completed goods receipt document (FR-INV-06, Release 7.0).
  STOCK_TRANSACTION_REF_TYPE_GOODS_RECEIPT = 3;
  // A posted stock issue document (phiếu xuất kho, FR-INV-20, Release 7.0).
  STOCK_TRANSACTION_REF_TYPE_STOCK_ISSUE = 4;
  // A completed stock count: the adjustment that makes stock equal the
  // count, or the reversal of a cancelled count (FR-INV-12, Release 7.1).
  STOCK_TRANSACTION_REF_TYPE_STOCK_COUNT = 5;
  // A write-off document, or the reversal of a cancelled one (FR-INV-09,
  // Release 7.1).
  STOCK_TRANSACTION_REF_TYPE_WRITE_OFF = 6;
  // A return to supplier document, or the reversal of a cancelled one
  // (FR-INV-10, Release 7.1).
  STOCK_TRANSACTION_REF_TYPE_SUPPLIER_RETURN = 7;
  // Unused parts returned from a repair order (FR-INV-11, Release 7.1);
  // ref_id is the repair order part return.
  STOCK_TRANSACTION_REF_TYPE_REPAIR_ORDER_RETURN = 8;
}

// StockLevel is one part with how many of it the garage has (FR-INV-03).
// The part itself (SKU, name, units, category, brand, price, images) is
// owned by the Catalogue module (vietgara.catalogue.v1); this is the
// stock-on-hand view that joins it with the balance.
message StockLevel {
  string part_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string sku = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string base_unit_name = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string base_unit_abbreviation = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  string category_name = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  string brand = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  bool is_active = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // URL of the first image, empty when the part has none.
  string thumbnail_url = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Decimal string in the base unit; derived from stock_transactions, never
  // written directly (FR-INV-03).
  string quantity_on_hand = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Decimal string in the base unit.
  string reorder_threshold = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // True at or below the reorder threshold.
  bool low_stock = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Decimal string in the base unit held by the part's draft stock issues
  // (Release 7.0, FR-INV-20): on hand minus this is what a new order can
  // reserve.
  string quantity_reserved = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  // quantity_on_hand minus quantity_reserved, in the base unit.
  string quantity_available = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Weighted-average cost per base unit, whole VND, rounded for display
  // (FR-INV-07). Omitted from answers when the caller lacks
  // PERMISSION_INVENTORY_COST_READ.
  optional int64 average_cost = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  // average_cost times quantity_on_hand, whole VND. Omitted without
  // PERMISSION_INVENTORY_COST_READ.
  optional int64 stock_value = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListStockLevelsRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Matches SKU, name or brand (answered by Catalogue).
  string query = 2;
  // Also matches the sub-categories of this category.
  string category_id = 3;
  string brand = 4;
  // Only parts at or below their reorder threshold.
  bool low_stock = 5;
  bool include_inactive = 6;
  int32 page = 7;
  int32 page_size = 8;
}

message ListStockLevelsResponse {
  repeated StockLevel data = 1;
  vietgara.common.v1.Pagination pagination = 2;
}

message GetStockLevelRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string part_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message GetStockLevelResponse {
  StockLevel stock_level = 1;
}

// StockTransaction is one recorded stock movement.
message StockTransaction {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_sku = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_name = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  StockTransactionType type = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Decimal string, always positive; type says the direction.
  string quantity = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Integer VND; set on IN transactions from a purchase.
  optional int64 unit_cost = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  StockTransactionRefType ref_type = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The repair order id, for an OUT transaction caused by one.
  string ref_id = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Release 6.0: the packaging unit the user entered and the typed amount;
  // `quantity` stays the base-unit amount. Empty when the base unit was used.
  optional string unit_id = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  string entered_quantity = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The abbreviation of the entered unit; empty when the base unit was used.
  string unit_abbreviation = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The abbreviation of the part's base unit, the unit `quantity` is in.
  string base_unit_abbreviation = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Release 7.1: the number of the document behind the movement (goods
  // receipt, stock issue, stock count, write-off or supplier return); empty
  // for a repair order part return and for movements without a document.
  string ref_number = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Release 7.1: why the movement happened, for adjustments (the write-off
  // reason, the repair order return reason; empty otherwise).
  string reason = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Release 7.1: the user who caused the movement; empty for system
  // movements (an automatic posting).
  string created_by_name = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Release 7.1: the part's quantity on hand right after the movement, in
  // the base unit (the running balance of the stock card).
  string quantity_after = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListStockTransactionsRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string part_id = 2;
  StockTransactionType type = 3;
  int32 page = 4;
  int32 page_size = 5;
  // Release 7.1: only movements caused by this kind of document.
  StockTransactionRefType ref_type = 6;
}

message ListStockTransactionsResponse {
  repeated StockTransaction data = 1;
  vietgara.common.v1.Pagination pagination = 2;
}

// GoodsReceiptStatus is the lifecycle of a goods receipt document
// (FR-INV-06): saved as a draft, then completed (which updates stock and
// cost), or cancelled (which reverses a completed one).
enum GoodsReceiptStatus {
  GOODS_RECEIPT_STATUS_UNSPECIFIED = 0;
  GOODS_RECEIPT_STATUS_DRAFT = 1;
  GOODS_RECEIPT_STATUS_COMPLETED = 2;
  GOODS_RECEIPT_STATUS_CANCELLED = 3;
}

// GoodsReceiptLine is one part on a goods receipt. Every line carries its
// supplier: the header's default_supplier_id is inherited by new lines,
// and the part's default supplier (FR-INV-19) pre-fills it.
message GoodsReceiptLine {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_id = 2 [(google.api.field_behavior) = REQUIRED];
  string part_sku = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_name = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string base_unit_abbreviation = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The packaging unit the user typed the quantity in; unset means the base
  // unit.
  optional string unit_id = 6;
  // The abbreviation of the entered unit; empty for the base unit.
  string unit_abbreviation = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // In the entered unit unless unit_id is unset (then the base unit). The
  // stored base amount is derived on save (quantity).
  string entered_quantity = 8;
  // The base-unit amount, derived from entered_quantity on save.
  string quantity = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The line's supplier; inherited from the header's default_supplier_id.
  // Empty is allowed while the receipt is a draft, but completion is
  // refused (SUPPLIER_REQUIRED) while any line has none (FR-INV-06).
  string supplier_id = 10;
  string supplier_name = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // VND per entered unit, as typed; stored per base unit. Zero means "not
  // recorded". Omitted from answers when the caller lacks
  // PERMISSION_INVENTORY_COST_READ; such a caller cannot set it either.
  optional int64 unit_cost = 12;
  // entered_quantity times unit_cost, whole VND, rounded half-up per line
  // (running total). Omitted without PERMISSION_INVENTORY_COST_READ.
  optional int64 line_amount = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// GoodsReceipt is a numbered multi-line document recording a delivery
// (FR-INV-06): header number, date, supplier delivery note and notes,
// status draft -> completed -> cancelled. One delivery from several
// suppliers is a single document whose lines name their supplier.
message GoodsReceipt {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string garage_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Rendered from the garage's goods_receipt numbering template
  // (FR-TEN-05); assigned when the document is created.
  string number = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  GoodsReceiptStatus status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The default supplier new lines inherit and may override.
  optional string default_supplier_id = 5;
  string default_supplier_name = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The receipt date, "YYYY-MM-DD" in the garage's timezone.
  string receipt_date = 7;
  // The supplier's own delivery note number.
  string delivery_note_number = 8;
  string notes = 9;
  repeated GoodsReceiptLine lines = 10;
  // Sum of the lines' amounts, whole VND. Omitted without
  // PERMISSION_INVENTORY_COST_READ.
  optional int64 total_amount = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Set when the receipt is completed / cancelled.
  google.protobuf.Timestamp completed_at = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp cancelled_at = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListGoodsReceiptsRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Matches the number, delivery note number or notes.
  string query = 2;
  // Only receipts with a line from this supplier.
  string supplier_id = 3;
  GoodsReceiptStatus status = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListGoodsReceiptsResponse {
  repeated GoodsReceipt data = 1;
  vietgara.common.v1.Pagination pagination = 2;
}

message GetGoodsReceiptRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string goods_receipt_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message GetGoodsReceiptResponse {
  GoodsReceipt goods_receipt = 1;
}

message CreateGoodsReceiptRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  GoodsReceipt goods_receipt = 2 [(google.api.field_behavior) = REQUIRED];
}

message CreateGoodsReceiptResponse {
  GoodsReceipt goods_receipt = 1;
}

message UpdateGoodsReceiptRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string goods_receipt_id = 2 [(google.api.field_behavior) = REQUIRED];
  GoodsReceipt goods_receipt = 3 [(google.api.field_behavior) = REQUIRED];
  // Fields of the receipt to replace; filled from the JSON body when
  // omitted. Only a DRAFT receipt can be updated (otherwise
  // GOODS_RECEIPT_NOT_DRAFT). "lines" replaces the whole list: lines are
  // matched by id, a line without an id is added and an existing line left
  // out is removed; partial line masks are not supported.
  google.protobuf.FieldMask update_mask = 4;
}

message UpdateGoodsReceiptResponse {
  GoodsReceipt goods_receipt = 1;
}

message CompleteGoodsReceiptRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string goods_receipt_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message CompleteGoodsReceiptResponse {
  GoodsReceipt goods_receipt = 1;
}

message CancelGoodsReceiptRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string goods_receipt_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message CancelGoodsReceiptResponse {
  GoodsReceipt goods_receipt = 1;
}

// PartSupplier is one usual supplier of a part with the supplier's own code
// and the last cost paid (FR-INV-19). One of them is the default that
// pre-fills a receipt line's supplier.
message PartSupplier {
  string supplier_id = 1 [(google.api.field_behavior) = REQUIRED];
  string supplier_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The supplier's own code for the part.
  string supplier_sku = 3;
  // The last cost paid per base unit, whole VND; omitted when never paid.
  optional int64 last_unit_cost = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  bool is_default = 5;
}

message GetPartSuppliersRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string part_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message GetPartSuppliersResponse {
  repeated PartSupplier data = 1;
}

message PutPartSuppliersRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string part_id = 2 [(google.api.field_behavior) = REQUIRED];
  // Replaces the part's list as a whole; at most one default.
  repeated PartSupplier data = 3;
}

message PutPartSuppliersResponse {
  repeated PartSupplier data = 1;
}

// StockIssueStatus is the lifecycle of a stock issue document (phiếu xuất
// kho, FR-INV-20): a draft follows its repair order (the draft is the
// reservation), then it is posted (stock movements written) or cancelled.
enum StockIssueStatus {
  STOCK_ISSUE_STATUS_UNSPECIFIED = 0;
  STOCK_ISSUE_STATUS_DRAFT = 1;
  STOCK_ISSUE_STATUS_POSTED = 2;
  STOCK_ISSUE_STATUS_CANCELLED = 3;
}

// StockIssueLine is one part line of a stock issue, derived from the
// matching part line of the repair order while it is a draft.
message StockIssueLine {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string repair_order_line_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_sku = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_name = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  string base_unit_abbreviation = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  optional string unit_id = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  string unit_abbreviation = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  string entered_quantity = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The base-unit amount posted on the issue.
  string quantity = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The cost snapshot per base unit, whole VND; omitted without
  // PERMISSION_INVENTORY_COST_READ.
  optional int64 unit_cost = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Release 7.1: the base-unit amount already returned to stock from this
  // line (FR-INV-11); what can still be returned is quantity minus this.
  string returned_quantity = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// StockIssue is the numbered stock-out document of a repair order
// (FR-INV-20). It is created as a draft with the repair order and follows
// it until posted; printing it uses the standard document layout.
message StockIssue {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string garage_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Rendered from the garage's stock_issue numbering template (FR-TEN-05).
  string number = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string repair_order_id = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string repair_order_number = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  StockIssueStatus status = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated StockIssueLine lines = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp posted_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  string posted_by_name = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetRepairOrderStockIssueRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string repair_order_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message GetRepairOrderStockIssueResponse {
  StockIssue stock_issue = 1;
}

message PostStockIssueRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string stock_issue_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message PostStockIssueResponse {
  StockIssue stock_issue = 1;
}

// StockCountStatus is the lifecycle of a stock count (FR-INV-12): a draft
// is counted line by line and can be merged with other drafts; completing it
// posts the adjustments and freezes it; cancelling a draft just closes it,
// cancelling a completed count posts the reversal.
enum StockCountStatus {
  STOCK_COUNT_STATUS_UNSPECIFIED = 0;
  STOCK_COUNT_STATUS_DRAFT = 1;
  STOCK_COUNT_STATUS_COMPLETED = 2;
  STOCK_COUNT_STATUS_CANCELLED = 3;
}

// StockCountLineResult compares a line's counted quantity with the system
// quantity.
enum StockCountLineResult {
  STOCK_COUNT_LINE_RESULT_UNSPECIFIED = 0;
  // No counted quantity typed yet.
  STOCK_COUNT_LINE_RESULT_UNCOUNTED = 1;
  // Counted equals the system quantity.
  STOCK_COUNT_LINE_RESULT_MATCHED = 2;
  // Counted is more than the system quantity.
  STOCK_COUNT_LINE_RESULT_OVER = 3;
  // Counted is less than the system quantity.
  STOCK_COUNT_LINE_RESULT_SHORT = 4;
}

// StockCountLine is one part of a stock count. system_quantity is a
// snapshot of the stock on hand taken when the line is added and again each
// time the counted quantity is typed ("the system quantity at the time of
// counting"); completing the count takes a final snapshot of every counted
// line, so that stock equals the count afterwards.
message StockCountLine {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_sku = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_name = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string base_unit_abbreviation = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The packaging unit the counted quantity was typed in; unset means the
  // base unit.
  optional string unit_id = 6;
  string unit_abbreviation = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The counted quantity as typed, in unit_id (or the base unit). Empty
  // means not counted yet; "0" is a real count of none.
  string entered_counted_quantity = 8;
  // The counted quantity in the base unit, derived; empty while uncounted.
  string counted_quantity = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The stock on hand in the base unit when the line was last counted.
  string system_quantity = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // counted_quantity minus system_quantity, base unit, signed (for example
  // "-2"); empty while uncounted.
  string difference_quantity = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  StockCountLineResult result = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The weighted-average cost per base unit the difference is valued at,
  // whole VND: the live average while a draft, the value used at completion
  // afterwards. Omitted without PERMISSION_INVENTORY_COST_READ.
  optional int64 average_cost = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  // difference_quantity times average_cost, whole VND, signed (a shortage is
  // negative); omitted without PERMISSION_INVENTORY_COST_READ.
  optional int64 difference_value = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the counted quantity was last typed.
  google.protobuf.Timestamp counted_at = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// StockCount is a numbered stock count document (FR-INV-12).
message StockCount {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string garage_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Rendered from the garage's stock_count numbering template (FR-TEN-05).
  string number = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  StockCountStatus status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // A label for the people counting, for example "Shelf A".
  string name = 5;
  string notes = 6;
  // Not included in list answers.
  repeated StockCountLine lines = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // How many lines are in each result; included in list answers too.
  int32 uncounted_lines = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  int32 matched_lines = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  int32 over_lines = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  int32 short_lines = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Sum of the lines' difference_value, whole VND, signed. Omitted without
  // PERMISSION_INVENTORY_COST_READ.
  optional int64 total_difference_value = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp completed_at = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  string completed_by_name = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp cancelled_at = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  string created_by_name = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListStockCountsRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Matches the number, name or notes.
  string query = 2;
  StockCountStatus status = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListStockCountsResponse {
  repeated StockCount data = 1;
  vietgara.common.v1.Pagination pagination = 2;
}

message GetStockCountRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string stock_count_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message GetStockCountResponse {
  StockCount stock_count = 1;
}

message CreateStockCountRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Only name and notes are read; lines are added with AddStockCountLines.
  StockCount stock_count = 2 [(google.api.field_behavior) = REQUIRED];
}

message CreateStockCountResponse {
  StockCount stock_count = 1;
}

message UpdateStockCountRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string stock_count_id = 2 [(google.api.field_behavior) = REQUIRED];
  StockCount stock_count = 3 [(google.api.field_behavior) = REQUIRED];
  // Fields to replace: "name" and "notes"; filled from the JSON body when
  // omitted. Lines have their own calls. Only a DRAFT count can be updated
  // (otherwise STOCK_COUNT_NOT_DRAFT).
  google.protobuf.FieldMask update_mask = 4;
}

message UpdateStockCountResponse {
  StockCount stock_count = 1;
}

// AddStockCountLinesRequest adds parts to a draft count, taking the system
// quantity snapshot of each. Parts already on the count are skipped. The
// scan, search and category pickers of the screen all end here; the Excel
// import and barcodes of Release 7.2 will too.
message AddStockCountLinesRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string stock_count_id = 2 [(google.api.field_behavior) = REQUIRED];
  // Parts picked one by one (search, scan).
  repeated string part_ids = 3;
  // Adds every active part of this category and its sub-categories that has
  // a stock balance or a reservation.
  string category_id = 4;
}

message AddStockCountLinesResponse {
  StockCount stock_count = 1;
}

// UpdateStockCountLineRequest types the counted quantity of one line. The
// body is a StockCountLine of which only unit_id and entered_counted_quantity
// are read; an empty entered_counted_quantity marks the line uncounted.
message UpdateStockCountLineRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string stock_count_id = 2 [(google.api.field_behavior) = REQUIRED];
  string line_id = 3 [(google.api.field_behavior) = REQUIRED];
  StockCountLine line = 4 [(google.api.field_behavior) = REQUIRED];
}

message UpdateStockCountLineResponse {
  StockCount stock_count = 1;
}

message DeleteStockCountLineRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string stock_count_id = 2 [(google.api.field_behavior) = REQUIRED];
  string line_id = 3 [(google.api.field_behavior) = REQUIRED];
}

message DeleteStockCountLineResponse {
  StockCount stock_count = 1;
}

// MergeStockCountsRequest folds several draft counts into the first one.
// A part that is on more than one of them keeps one line whose counted
// quantity is the sum of the counted quantities (two people counted
// different places); an uncounted line gives way to a counted one. The
// other counts become CANCELLED and their lines move to the first.
message MergeStockCountsRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // At least two draft counts; the first is kept and returned.
  repeated string stock_count_ids = 2 [(google.api.field_behavior) = REQUIRED];
}

message MergeStockCountsResponse {
  StockCount stock_count = 1;
}

message CompleteStockCountRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string stock_count_id = 2 [(google.api.field_behavior) = REQUIRED];
  // Drop the lines that were never counted instead of refusing
  // (STOCK_COUNT_HAS_UNCOUNTED_LINES).
  bool skip_uncounted = 3;
}

message CompleteStockCountResponse {
  StockCount stock_count = 1;
}

message CancelStockCountRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string stock_count_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message CancelStockCountResponse {
  StockCount stock_count = 1;
}

// AdjustmentStatus is the lifecycle of a write-off or a supplier return:
// created already posted, cancelled by a reversing movement.
enum AdjustmentStatus {
  ADJUSTMENT_STATUS_UNSPECIFIED = 0;
  ADJUSTMENT_STATUS_COMPLETED = 1;
  ADJUSTMENT_STATUS_CANCELLED = 2;
}

// WriteOffReason is why stock is written off (FR-INV-09).
enum WriteOffReason {
  WRITE_OFF_REASON_UNSPECIFIED = 0;
  WRITE_OFF_REASON_DAMAGED = 1;
  WRITE_OFF_REASON_LOST = 2;
  WRITE_OFF_REASON_EXPIRED = 3;
  WRITE_OFF_REASON_INTERNAL_USE = 4;
  WRITE_OFF_REASON_WARRANTY_REPLACEMENT = 5;
}

// WriteOffLine is one part of a write-off.
message WriteOffLine {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_id = 2 [(google.api.field_behavior) = REQUIRED];
  string part_sku = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_name = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string base_unit_abbreviation = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The packaging unit the quantity is typed in; unset means the base unit.
  optional string unit_id = 6;
  string unit_abbreviation = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // In unit_id, or the base unit; must be positive.
  string entered_quantity = 8 [(google.api.field_behavior) = REQUIRED];
  // The base-unit amount, derived.
  string quantity = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The average cost per base unit at the moment of the write-off, whole
  // VND. Omitted without PERMISSION_INVENTORY_COST_READ.
  optional int64 unit_cost = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // quantity times unit_cost, whole VND. Omitted without
  // PERMISSION_INVENTORY_COST_READ.
  optional int64 line_value = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// WriteOff is a numbered document that reduces stock at average cost
// (FR-INV-09). It is posted when created; mistakes are undone by cancelling
// it, which puts the parts back.
message WriteOff {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string garage_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Rendered from the garage's write_off numbering template (FR-TEN-05).
  string number = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  AdjustmentStatus status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  WriteOffReason reason = 5 [(google.api.field_behavior) = REQUIRED];
  string notes = 6;
  repeated WriteOffLine lines = 7;
  // Sum of the lines' value, whole VND. Omitted without
  // PERMISSION_INVENTORY_COST_READ.
  optional int64 total_value = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp cancelled_at = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  string created_by_name = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListWriteOffsRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Matches the number or notes.
  string query = 2;
  WriteOffReason reason = 3;
  AdjustmentStatus status = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListWriteOffsResponse {
  repeated WriteOff data = 1;
  vietgara.common.v1.Pagination pagination = 2;
}

message GetWriteOffRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string write_off_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message GetWriteOffResponse {
  WriteOff write_off = 1;
}

message CreateWriteOffRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  WriteOff write_off = 2 [(google.api.field_behavior) = REQUIRED];
}

message CreateWriteOffResponse {
  WriteOff write_off = 1;
}

message CancelWriteOffRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string write_off_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message CancelWriteOffResponse {
  WriteOff write_off = 1;
}

// SupplierReturnLine is one part of a return to a supplier.
message SupplierReturnLine {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_id = 2 [(google.api.field_behavior) = REQUIRED];
  string part_sku = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_name = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string base_unit_abbreviation = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  optional string unit_id = 6;
  string unit_abbreviation = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  string entered_quantity = 8 [(google.api.field_behavior) = REQUIRED];
  // The base-unit amount, derived.
  string quantity = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The credit the supplier gives, VND per entered unit, as typed. Zero or
  // unset takes the cost of the same part on the linked goods receipt when
  // there is one, else the part's average cost. Omitted from answers, and
  // ignored on input, without PERMISSION_INVENTORY_COST_READ.
  optional int64 unit_cost = 10;
  // entered_quantity times unit_cost, whole VND, rounded half-up per line.
  // Omitted without PERMISSION_INVENTORY_COST_READ.
  optional int64 line_amount = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// SupplierReturn is a numbered document that reduces stock and records the
// credit owed by the supplier (FR-INV-10). It is posted when created;
// cancelling it puts the parts back.
message SupplierReturn {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string garage_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Rendered from the garage's supplier_return numbering template.
  string number = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  AdjustmentStatus status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string supplier_id = 5 [(google.api.field_behavior) = REQUIRED];
  string supplier_name = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The completed goods receipt the parts came from, when known.
  optional string goods_receipt_id = 7;
  string goods_receipt_number = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The supplier's own credit note number, when they have issued one.
  string credit_note_number = 9;
  string notes = 10;
  repeated SupplierReturnLine lines = 11;
  // The credit recorded against the supplier: the sum of the lines'
  // amounts, whole VND. Omitted without PERMISSION_INVENTORY_COST_READ.
  optional int64 credit_amount = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp cancelled_at = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  string created_by_name = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListSupplierReturnsRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Matches the number, credit note number or notes.
  string query = 2;
  string supplier_id = 3;
  AdjustmentStatus status = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListSupplierReturnsResponse {
  repeated SupplierReturn data = 1;
  vietgara.common.v1.Pagination pagination = 2;
}

message GetSupplierReturnRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string supplier_return_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message GetSupplierReturnResponse {
  SupplierReturn supplier_return = 1;
}

message CreateSupplierReturnRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  SupplierReturn supplier_return = 2 [(google.api.field_behavior) = REQUIRED];
}

message CreateSupplierReturnResponse {
  SupplierReturn supplier_return = 1;
}

message CancelSupplierReturnRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string supplier_return_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message CancelSupplierReturnResponse {
  SupplierReturn supplier_return = 1;
}

// RepairOrderPartReturn records unused parts of a repair order coming back
// to stock (FR-INV-11): the stock is restored at the cost they left with.
// It is immutable. It does not change the repair order's lines or what the
// customer is billed.
message RepairOrderPartReturn {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string garage_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string repair_order_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string repair_order_number = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string stock_issue_id = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The repair order part line the parts are returned from.
  string repair_order_line_id = 6 [(google.api.field_behavior) = REQUIRED];
  string part_id = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_sku = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_name = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  string base_unit_abbreviation = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The packaging unit the quantity is typed in; unset means the base unit.
  optional string unit_id = 11;
  string unit_abbreviation = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  string entered_quantity = 13 [(google.api.field_behavior) = REQUIRED];
  // The base-unit amount, derived.
  string quantity = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Why the parts came back; required.
  string reason = 15 [(google.api.field_behavior) = REQUIRED];
  // The cost per base unit the parts are restored at (the line's cost
  // snapshot), whole VND; omitted without PERMISSION_INVENTORY_COST_READ.
  optional int64 unit_cost = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
  string created_by_name = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ReturnRepairOrderPartRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string repair_order_id = 2 [(google.api.field_behavior) = REQUIRED];
  // Only repair_order_line_id, unit_id, entered_quantity and reason are read.
  RepairOrderPartReturn part_return = 3 [(google.api.field_behavior) = REQUIRED];
}

message ReturnRepairOrderPartResponse {
  RepairOrderPartReturn part_return = 1;
}

message ListRepairOrderPartReturnsRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string repair_order_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message ListRepairOrderPartReturnsResponse {
  repeated RepairOrderPartReturn data = 1;
}

// PurchaseLine is one line of a completed goods receipt in the purchases
// report (FR-INV-19).
message PurchaseLine {
  string goods_receipt_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string goods_receipt_number = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The receipt date, "YYYY-MM-DD".
  string receipt_date = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string supplier_id = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string supplier_name = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_id = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_sku = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_name = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The base-unit amount.
  string quantity = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  string base_unit_abbreviation = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The cost per base unit, whole VND.
  int64 unit_cost = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // quantity times unit_cost, whole VND.
  int64 amount = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetPurchasesReportRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  string supplier_id = 2;
  // Inclusive, "YYYY-MM-DD" in the garage's timezone.
  string from = 3;
  // Exclusive, "YYYY-MM-DD".
  string to = 4;
}

message GetPurchasesReportResponse {
  repeated PurchaseLine data = 1;
  // Sum of every line's amount, over the requested range.
  int64 total_amount = 2;
}

// StockValuationLine is one part's quantity and value at a date
// (FR-INV-07). Only callers with PERMISSION_INVENTORY_COST_READ see it.
message StockValuationLine {
  string part_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_sku = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string part_name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string category_id = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string category_name = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The base-unit amount on hand.
  string quantity_on_hand = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  string base_unit_abbreviation = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The weighted-average cost per base unit, whole VND.
  int64 average_cost = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // quantity_on_hand times average_cost, whole VND.
  int64 value = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// StockValuationCategory is one category's total value.
message StockValuationCategory {
  string category_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string category_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  int64 value = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetStockValuationReportRequest {
  string garage_id = 1 [(google.api.field_behavior) = REQUIRED];
  // The date to value at, "YYYY-MM-DD" in the garage's timezone; empty
  // means today.
  string at = 2;
}

message GetStockValuationReportResponse {
  repeated StockValuationLine data = 1;
  repeated StockValuationCategory categories = 2;
  int64 total_value = 3;
  // The date valued at, "YYYY-MM-DD"; today when the request left it
  // empty.
  string at = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// InventoryService manages how many of each part a garage has (FRD 3.7).
// Reads need PERMISSION_INVENTORY_READ, changes PERMISSION_INVENTORY_WRITE
// (stock counts need PERMISSION_INVENTORY_COUNT, write-offs, supplier
// returns and repair order part returns PERMISSION_INVENTORY_ADJUST).
// The parts themselves are managed by CatalogueService.
service InventoryService {
  // The stock-on-hand list (FR-INV-03): parts with their balances.
  rpc ListStockLevels(ListStockLevelsRequest) returns (ListStockLevelsResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/stock-levels"};
  }

  rpc GetStockLevel(GetStockLevelRequest) returns (GetStockLevelResponse) {
    option (google.api.http) = {
      get: "/api/v1/garages/{garage_id}/stock-levels/{part_id}"
      response_body: "stock_level"
    };
  }

  // The stock in/out/on-hand movement report (FR-INV-05).
  rpc ListStockTransactions(ListStockTransactionsRequest) returns (ListStockTransactionsResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/reports/stock-movements"};
  }

  // Goods receipt documents (FR-INV-06, Release 7.0): a multi-line receipt
  // with a supplier per line. Reads need PERMISSION_INVENTORY_READ,
  // changes PERMISSION_INVENTORY_WRITE.
  rpc ListGoodsReceipts(ListGoodsReceiptsRequest) returns (ListGoodsReceiptsResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/goods-receipts"};
  }

  rpc GetGoodsReceipt(GetGoodsReceiptRequest) returns (GetGoodsReceiptResponse) {
    option (google.api.http) = {
      get: "/api/v1/garages/{garage_id}/goods-receipts/{goods_receipt_id}"
      response_body: "goods_receipt"
    };
  }

  rpc CreateGoodsReceipt(CreateGoodsReceiptRequest) returns (CreateGoodsReceiptResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/goods-receipts"
      body: "goods_receipt"
      response_body: "goods_receipt"
    };
  }

  rpc UpdateGoodsReceipt(UpdateGoodsReceiptRequest) returns (UpdateGoodsReceiptResponse) {
    option (google.api.http) = {
      patch: "/api/v1/garages/{garage_id}/goods-receipts/{goods_receipt_id}"
      body: "goods_receipt"
      response_body: "goods_receipt"
    };
  }

  // Completing posts the receipt's stock movements; refused with
  // SUPPLIER_REQUIRED while a line has no supplier and with
  // GOODS_RECEIPT_NOT_DRAFT unless the receipt is a draft.
  rpc CompleteGoodsReceipt(CompleteGoodsReceiptRequest) returns (CompleteGoodsReceiptResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/goods-receipts/{goods_receipt_id}:complete"
      body: "*"
      response_body: "goods_receipt"
    };
  }

  // Cancelling a draft just closes it. Cancelling a completed receipt
  // reverses its stock movements, and is refused with
  // INSUFFICIENT_STOCK_TO_REVERSE when the reversal would take a part below
  // zero. A cancelled receipt cannot be cancelled again
  // (GOODS_RECEIPT_ALREADY_CANCELLED).
  rpc CancelGoodsReceipt(CancelGoodsReceiptRequest) returns (CancelGoodsReceiptResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/goods-receipts/{goods_receipt_id}:cancel"
      body: "*"
      response_body: "goods_receipt"
    };
  }

  // The usual suppliers of a part with their code, last cost and default
  // (FR-INV-19, Release 7.0).
  rpc GetPartSuppliers(GetPartSuppliersRequest) returns (GetPartSuppliersResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/parts/{part_id}/suppliers"};
  }

  rpc PutPartSuppliers(PutPartSuppliersRequest) returns (PutPartSuppliersResponse) {
    option (google.api.http) = {
      put: "/api/v1/garages/{garage_id}/parts/{part_id}/suppliers"
      body: "*"
    };
  }

  // The repair order's stock issue document (FR-INV-20, Release 7.0),
  // created with the order and, while a draft, following its part lines.
  rpc GetRepairOrderStockIssue(GetRepairOrderStockIssueRequest) returns (GetRepairOrderStockIssueResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/repair-orders/{repair_order_id}/stock-issue"};
  }

  // Posts the issue now ("issue now"); otherwise the repair order's
  // closing posts it. A stock issue has no cancel RPC: the repair order
  // cancels its draft issue.
  rpc PostStockIssue(PostStockIssueRequest) returns (PostStockIssueResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/stock-issues/{stock_issue_id}:post"
      body: "*"
      response_body: "stock_issue"
    };
  }

  // Stock counts (FR-INV-12, Release 7.1). Reads need PERMISSION_INVENTORY_READ,
  // every change PERMISSION_INVENTORY_COUNT. Reasons: STOCK_COUNT_NOT_DRAFT,
  // STOCK_COUNT_ALREADY_CANCELLED, STOCK_COUNT_HAS_UNCOUNTED_LINES (complete),
  // INSUFFICIENT_STOCK_TO_REVERSE (cancel of a completed count).
  rpc ListStockCounts(ListStockCountsRequest) returns (ListStockCountsResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/stock-counts"};
  }

  rpc GetStockCount(GetStockCountRequest) returns (GetStockCountResponse) {
    option (google.api.http) = {
      get: "/api/v1/garages/{garage_id}/stock-counts/{stock_count_id}"
      response_body: "stock_count"
    };
  }

  rpc CreateStockCount(CreateStockCountRequest) returns (CreateStockCountResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/stock-counts"
      body: "stock_count"
      response_body: "stock_count"
    };
  }

  rpc UpdateStockCount(UpdateStockCountRequest) returns (UpdateStockCountResponse) {
    option (google.api.http) = {
      patch: "/api/v1/garages/{garage_id}/stock-counts/{stock_count_id}"
      body: "stock_count"
      response_body: "stock_count"
    };
  }

  rpc AddStockCountLines(AddStockCountLinesRequest) returns (AddStockCountLinesResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/stock-counts/{stock_count_id}/lines"
      body: "*"
      response_body: "stock_count"
    };
  }

  rpc UpdateStockCountLine(UpdateStockCountLineRequest) returns (UpdateStockCountLineResponse) {
    option (google.api.http) = {
      patch: "/api/v1/garages/{garage_id}/stock-counts/{stock_count_id}/lines/{line_id}"
      body: "line"
      response_body: "stock_count"
    };
  }

  rpc DeleteStockCountLine(DeleteStockCountLineRequest) returns (DeleteStockCountLineResponse) {
    option (google.api.http) = {
      delete: "/api/v1/garages/{garage_id}/stock-counts/{stock_count_id}/lines/{line_id}"
      response_body: "stock_count"
    };
  }

  // Folds several drafts into the first one; the others become cancelled.
  rpc MergeStockCounts(MergeStockCountsRequest) returns (MergeStockCountsResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/stock-counts:merge"
      body: "*"
      response_body: "stock_count"
    };
  }

  // Posts one adjustment movement per counted line that differs, so that
  // stock equals the count; the count can no longer be edited.
  rpc CompleteStockCount(CompleteStockCountRequest) returns (CompleteStockCountResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/stock-counts/{stock_count_id}:complete"
      body: "*"
      response_body: "stock_count"
    };
  }

  // Cancelling a draft just closes it; cancelling a completed count posts
  // the reversal of its adjustments.
  rpc CancelStockCount(CancelStockCountRequest) returns (CancelStockCountResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/stock-counts/{stock_count_id}:cancel"
      body: "*"
      response_body: "stock_count"
    };
  }

  // Write-offs (FR-INV-09, Release 7.1). Reads need PERMISSION_INVENTORY_READ,
  // changes PERMISSION_INVENTORY_ADJUST. Creating one posts it; it is
  // refused with INSUFFICIENT_STOCK when a part is not on hand in that
  // quantity. Cancelling restores the stock (WRITE_OFF_ALREADY_CANCELLED
  // when repeated).
  rpc ListWriteOffs(ListWriteOffsRequest) returns (ListWriteOffsResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/write-offs"};
  }

  rpc GetWriteOff(GetWriteOffRequest) returns (GetWriteOffResponse) {
    option (google.api.http) = {
      get: "/api/v1/garages/{garage_id}/write-offs/{write_off_id}"
      response_body: "write_off"
    };
  }

  rpc CreateWriteOff(CreateWriteOffRequest) returns (CreateWriteOffResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/write-offs"
      body: "write_off"
      response_body: "write_off"
    };
  }

  rpc CancelWriteOff(CancelWriteOffRequest) returns (CancelWriteOffResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/write-offs/{write_off_id}:cancel"
      body: "*"
      response_body: "write_off"
    };
  }

  // Returns to supplier (FR-INV-10, Release 7.1). Reads need
  // PERMISSION_INVENTORY_READ, changes PERMISSION_INVENTORY_ADJUST. Creating
  // one posts it (INSUFFICIENT_STOCK when a part is short; the linked goods
  // receipt must be completed, else GOODS_RECEIPT_NOT_COMPLETED).
  // Cancelling restores the stock (SUPPLIER_RETURN_ALREADY_CANCELLED when
  // repeated).
  rpc ListSupplierReturns(ListSupplierReturnsRequest) returns (ListSupplierReturnsResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/supplier-returns"};
  }

  rpc GetSupplierReturn(GetSupplierReturnRequest) returns (GetSupplierReturnResponse) {
    option (google.api.http) = {
      get: "/api/v1/garages/{garage_id}/supplier-returns/{supplier_return_id}"
      response_body: "supplier_return"
    };
  }

  rpc CreateSupplierReturn(CreateSupplierReturnRequest) returns (CreateSupplierReturnResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/supplier-returns"
      body: "supplier_return"
      response_body: "supplier_return"
    };
  }

  rpc CancelSupplierReturn(CancelSupplierReturnRequest) returns (CancelSupplierReturnResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/supplier-returns/{supplier_return_id}:cancel"
      body: "*"
      response_body: "supplier_return"
    };
  }

  // Returns unused parts of a repair order to stock (FR-INV-11, Release
  // 7.1); needs PERMISSION_INVENTORY_ADJUST. The order's stock issue must be
  // posted (STOCK_ISSUE_NOT_POSTED: until then the draft just follows the
  // order's lines), and the total returned from a line cannot exceed what
  // was issued (RETURN_EXCEEDS_ISSUED).
  rpc ReturnRepairOrderPart(ReturnRepairOrderPartRequest) returns (ReturnRepairOrderPartResponse) {
    option (google.api.http) = {
      post: "/api/v1/garages/{garage_id}/repair-orders/{repair_order_id}/part-returns"
      body: "part_return"
      response_body: "part_return"
    };
  }

  rpc ListRepairOrderPartReturns(ListRepairOrderPartReturnsRequest) returns (ListRepairOrderPartReturnsResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/repair-orders/{repair_order_id}/part-returns"};
  }

  // Purchases by supplier and period (FR-INV-19), from completed goods
  // receipts. Needs PERMISSION_INVENTORY_COST_READ; without it the whole call
  // is refused with PERMISSION_DENIED (its cost fields are not omitted).
  rpc GetPurchasesReport(GetPurchasesReportRequest) returns (GetPurchasesReportResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/reports/purchases"};
  }

  // Quantity and value per part and category at a date (FR-INV-07). Needs
  // PERMISSION_INVENTORY_COST_READ; without it the whole call is refused
  // with PERMISSION_DENIED (its cost fields are not omitted).
  rpc GetStockValuationReport(GetStockValuationReportRequest) returns (GetStockValuationReportResponse) {
    option (google.api.http) = {get: "/api/v1/garages/{garage_id}/reports/stock-valuation"};
  }
}
